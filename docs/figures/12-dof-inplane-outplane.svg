<svg xmlns="http://www.w3.org/2000/svg" width="740" height="472" viewBox="0 0 740 472" role="img" aria-label="여섯 자유도의 분류. v_x, v_z, ω_y는 영상면을 불변으로 두는 면내 운동이고 v_y, ω_x, ω_z는 평면을 옮기는 면외 운동이다.">
  <title>여섯 자유도 — 면내/면외</title>
  <style>
    svg{--surface:#FFFFFF;--panel:#F4F8F7;--ink:#15211F;--ink2:#394A47;--muted:#697B78;--hair:#D5DEDC;
        --in:#0B7A67;--in-soft:rgba(11,122,103,.10);--out:#B0452B;--out-soft:rgba(176,69,43,.10);
        --sans:system-ui,"Noto Sans CJK KR","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
        --mono:"DejaVu Sans Mono","JetBrains Mono",ui-monospace,monospace;}
    @media (prefers-color-scheme:dark){
      svg{--surface:#171F1D;--panel:#131A19;--ink:#E7EEEC;--ink2:#BDCAC7;--muted:#8A9C99;--hair:#2B3936;
          --in:#4CD5B8;--in-soft:rgba(76,213,184,.15);--out:#F0906F;--out-soft:rgba(240,144,111,.15);}
    }
    .bg{fill:var(--surface)}
    .s-fg{stroke:var(--ink)} .s-mut{stroke:var(--muted)} .s-hair{stroke:var(--hair)}
    .s-in{stroke:var(--in)} .s-out{stroke:var(--out)}
    .f-in{fill:var(--in-soft)} .f-out{fill:var(--out-soft)}
    .f-surf{fill:var(--surface)} .f-panel{fill:var(--panel)}
    .mk-fg{fill:var(--ink)} .mk-mut{fill:var(--muted)} .mk-in{fill:var(--in)} .mk-out{fill:var(--out)}
    .t{font-family:var(--sans);font-size:12px;fill:var(--ink2)}
    .tm{font-family:var(--mono);font-size:12.5px;fill:var(--ink)}
    .tmu{font-family:var(--sans);font-size:11px;fill:var(--muted)}
    .tin{fill:var(--in)} .tout{fill:var(--out)}
    .tt{font-family:var(--mono);font-size:14px;font-weight:500}
    .no-fill{fill:none}
  </style>
  <defs>
    <marker id="ar-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-fg"/></marker>
    <marker id="ar-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-mut"/></marker>
    <marker id="ar-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-in"/></marker>
    <marker id="ar-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-out"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="740" height="472"/>
      <text x="40" y="30" class="tm tin">면내 — 평면이 제자리</text>
      <text x="40" y="47" class="tmu">같은 해부 단면의 2D 강체변환 · 상호작용 행렬이 정확하고 상수</text>
      <line x1="40" y1="58" x2="700" y2="58" class="s-in" stroke-width="1.4"/>

      <!-- ROW 1 -->
      <g transform="translate(150,112)">
        <text x="0" y="-34" class="tt tin" text-anchor="middle">v_x</text>
        <text x="0" y="-16" class="tmu" text-anchor="middle">측방 슬라이딩</text>
        <rect x="-48" y="0" width="96" height="55" class="f-in s-in" stroke-width="1.5"/>
        <ellipse cx="-22" cy="36" rx="12" ry="9" class="no-fill s-mut" stroke-width="1.1" stroke-dasharray="3 3"/>
        <ellipse cx="20" cy="36" rx="12" ry="9" class="f-in s-in" stroke-width="1.3"/>
        <line x1="-22" y1="17" x2="20" y2="17" class="s-in" stroke-width="1.6" marker-end="url(#ar-in)"/>
        <text x="0" y="88" class="t tin" text-anchor="middle">Π 그대로</text>
        <text x="0" y="107" class="tmu" text-anchor="middle">영상 policy</text>
      </g>
      <g transform="translate(370,112)">
        <text x="0" y="-34" class="tt tin" text-anchor="middle">v_z</text>
        <text x="0" y="-16" class="tmu" text-anchor="middle">압입 · 깊이</text>
        <rect x="-48" y="0" width="96" height="55" class="f-in s-in" stroke-width="1.5"/>
        <ellipse cx="-2" cy="17" rx="12" ry="9" class="no-fill s-mut" stroke-width="1.1" stroke-dasharray="3 3"/>
        <ellipse cx="-2" cy="41" rx="12" ry="9" class="f-in s-in" stroke-width="1.3"/>
        <line x1="30" y1="14" x2="30" y2="44" class="s-in" stroke-width="1.6" marker-end="url(#ar-in)"/>
        <text x="0" y="88" class="t tin" text-anchor="middle">Π 그대로</text>
        <text x="0" y="107" class="tmu" text-anchor="middle">admittance</text>
      </g>
      <g transform="translate(590,112)">
        <text x="0" y="-34" class="tt tin" text-anchor="middle">ω_y</text>
        <text x="0" y="-16" class="tmu" text-anchor="middle">힐-토 로킹</text>
        <rect x="-48" y="0" width="96" height="55" class="f-in s-in" stroke-width="1.5"/>
        <ellipse cx="0" cy="32" rx="17" ry="9" class="no-fill s-mut" stroke-width="1.1" stroke-dasharray="3 3"/>
        <ellipse cx="0" cy="32" rx="17" ry="9" class="f-in s-in" stroke-width="1.3" transform="rotate(40 0 32)"/>
        <path d="M -24 19 A 26 26 0 0 1 24 19" class="no-fill s-in" stroke-width="1.5" marker-end="url(#ar-in)"/>
        <text x="0" y="88" class="t tin" text-anchor="middle">Π 그대로</text>
        <text x="0" y="107" class="tmu" text-anchor="middle">아날리틱 M_y→0</text>
      </g>

      <text x="40" y="270" class="tm tout">면외 — 평면이 떠남</text>
      <text x="40" y="287" class="tmu">다른 해부 단면 · 변화량이 영상 밖 3D 형상(κ)에 의존</text>
      <line x1="40" y1="298" x2="700" y2="298" class="s-out" stroke-width="1.4"/>

      <!-- ROW 2 -->
      <g transform="translate(150,346)">
        <text x="0" y="-34" class="tt tout" text-anchor="middle">v_y</text>
        <text x="0" y="-16" class="tmu" text-anchor="middle">elevational 슬라이딩</text>
        <rect x="-48" y="0" width="96" height="55" class="no-fill s-mut" stroke-width="1.2" stroke-dasharray="3 3"/>
        <rect x="-28.4" y="18.2" width="96" height="55" class="f-out s-out" stroke-width="1.5"/>
        <line x1="0" y1="27" x2="19.6" y2="45.2" class="s-out" stroke-width="1.8" marker-end="url(#ar-out)"/>
        <text x="0" y="94" class="t tout" text-anchor="middle">Π 이동</text>
        <text x="0" y="113" class="tmu" text-anchor="middle">영상 policy</text>
      </g>
      <g transform="translate(370,346)">
        <text x="0" y="-34" class="tt tout" text-anchor="middle">ω_x</text>
        <text x="0" y="-16" class="tmu" text-anchor="middle">팬 · 틸트</text>
        <rect x="-48" y="0" width="96" height="55" class="no-fill s-mut" stroke-width="1.2" stroke-dasharray="3 3"/>
        <polygon points="-48,0 48,0 67.6,73.2 -28.4,73.2" class="f-out s-out" stroke-width="1.5"/>
        <path d="M 54 7 Q 67 13 63 26" class="no-fill s-out" stroke-width="1.6" marker-end="url(#ar-out)"/>
        <text x="0" y="94" class="t tout" text-anchor="middle">Π 이동</text>
        <text x="0" y="113" class="tmu" text-anchor="middle">아날리틱 M_x→0</text>
      </g>
      <g transform="translate(590,346)">
        <text x="0" y="-34" class="tt tout" text-anchor="middle">ω_z</text>
        <text x="0" y="-16" class="tmu" text-anchor="middle">프로브 회전</text>
        <rect x="-48" y="0" width="96" height="55" class="no-fill s-mut" stroke-width="1.2" stroke-dasharray="3 3"/>
        <polygon points="-56.4,-7.8 56.4,7.8 56.4,62.8 -56.4,47.2" class="f-out s-out" stroke-width="1.5"/>
        <path d="M -26 45 Q 0 53 26 62" class="no-fill s-out" stroke-width="1.6" marker-end="url(#ar-out)"/>
        <text x="0" y="94" class="t tout" text-anchor="middle">Π 이동</text>
        <text x="0" y="113" class="tmu" text-anchor="middle">영상 policy</text>
      </g>
    </svg>
