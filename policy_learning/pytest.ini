[pytest]
testpaths = tests
python_files = test_*.py
# ROS 의 pytest 플러그인 둘을 끈다. /opt/ros/jazzy 가 PYTHONPATH 에 있으면 pytest 가
# 이것들을 자동으로 집어가는데, 배포판 pytest(7.x)에 맞춰 쓰인 훅이라 venv 의 최신
# pytest 에서는 훅 검증에 걸려 **수집 전에** 죽는다 — 테스트 하나도 못 돌고
# PluginValidationError 만 나오므로 원인이 테스트에 있는 것처럼 보인다.
# 이 저장소의 테스트는 launch_testing 을 쓰지 않는다.
addopts = -ra -q -p no:launch_testing -p no:launch_ros
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
