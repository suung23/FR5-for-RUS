# Shared defaults for every experiment. This file intentionally contains NO
# `model` section: model presets differ structurally between architectures and
# inheriting them would leak incompatible constructor arguments.

experiment:
  seed: 42

data:
  manifest: data/bladder/manifest.csv
  root: null                     # defaults to the manifest's own directory
  image_size: [128, 128]
  intensity_normalization: zero_one    # zero_one | mean_std | per_image
  temporal_interval: 1
  require_labeled_current: true

split:
  # 학습 : 검증 = 7 : 3. 별도 시험셋을 두지 않는 결정이므로 test 는 0.
  #
  # 비율은 프레임이 아니라 **환자 수**에 걸린다. 한 스윕의 프레임은 서로 강하게
  # 상관되어 있어 프레임 단위로 나누면 같은 환자의 해부가 학습셋에서 검증셋으로
  # 새고 모든 수치가 부풀려진다. assert_no_patient_leakage 가 이를 강제한다.
  # 환자 10명 -> train 7 / val 3.
  #
  # strategy: patient_random 인 이유 — 새로 도착한 manifest 에는 split 열이 없다.
  # manifest 전략은 그 열을 요구하므로 데이터가 오자마자 실패한다. 나중에 분할을
  # 고정하고 싶으면 scripts/check_dataset.py --write-split 로 열을 채운 뒤
  # strategy 를 manifest 로 바꾸면 된다.
  strategy: patient_random       # manifest | patient_random
  ratios: [0.70, 0.30, 0.00]     # train : val : test
  seed: 42

  # ⚠️ test 를 0 으로 두면 임계값을 고른 데이터와 성능을 보고하는 데이터가 같아진다.
  # docs/VALIDATION_PLAN.md 의 운용점(Q 임계)·accuracy_floor·target_bad_rate 는
  # 전부 검증셋에서 고르는 값이므로, 같은 셋에서 낙관적으로 나온다.
  # 환자가 충분해지면 3분할로 되돌릴 것: ratios [0.70, 0.15, 0.15] + evaluation.split: test

augmentation:
  enabled: true
  horizontal_flip: 0.5
  vertical_flip: 0.0
  rotation_degrees: 10.0
  scale_range: [0.9, 1.1]
  translate_ratio: 0.05
  brightness: 0.1
  contrast: 0.1
  gamma_range: [0.8, 1.25]
  gaussian_noise_std: 0.01
  speckle_noise_std: 0.0
  independent_photometric: false

loss:
  bce_weight: 1.0
  dice_weight: 1.0
  jaccard_weight: 1.0
  smooth: 1.0
  eps: 1.0e-7
  temporal:
    enabled: false

flow:
  backend: precomputed           # precomputed | farneback | raft_small | identity
  require_flow: false
  params: {}
  reliability:
    flow_consistency_threshold: 1.5
    photometric_threshold: 0.15
    max_flow_magnitude: 20.0
    border_exclusion_px: 4
    temperature: 0.5
    min_reliable_ratio: 0.10
    reliable_pixel_threshold: 0.5
    use_photometric: true
    use_speckle: false
    speckle_window: 9
    speckle_threshold: 0.3

train:
  epochs: 40
  batch_size: 8
  num_workers: 2
  device: auto                   # auto | cpu | cuda | cuda:0
  amp: false
  grad_clip: 1.0
  checkpoint_dir: checkpoints/default
  optimizer:
    name: adam                   # adam | adamw | sgd | rmsprop
    lr: 1.0e-3
    weight_decay: 1.0e-5
  scheduler:
    name: cosine                 # none | cosine | step | plateau
    eta_min: 1.0e-6
  model_selection:
    # Spatial accuracy dominates on purpose: a perfectly stable but
    # anatomically wrong prediction must never win model selection.
    spatial_weight: 1.0
    temporal_weight: 0.0

postprocess:
  threshold: 0.5
  largest_component: true
  min_component_area_ratio: 0.0005
  fill_holes: false
  smooth_contour: false
  smooth_kernel: 3
  connectivity: 8

control:
  boundary_band_px: 2
  surrounding_ring_px: 6
  keep_binary_mask: true
  keep_probability_map: true

  # The imaged sector. Defined ONCE here and consumed by BOTH quality functions
  # (Q_seg's denominators and Q_raw's A-line support), because it is a property
  # of the ultrasound machine, not of either score.
  #
  # `full` reproduces the whole-frame behaviour exactly and is the default.
  # Setting a real ROI changes four things, all of which are currently wrong for
  # a probe whose image does not fill the frame:
  #   - mask_area_ratio's denominator      (crop currently moves the optimal force)
  #   - segmentation_confidence's support  (dead region currently dominates)
  #   - mean_boundary_entropy's band
  #   - lumen_surrounding_contrast's ring  (currently samples black outside the beam)
  #   - which edge border_contact_ratio counts (currently the rectangle, which a
  #     fan never reaches -- so the criterion silently never fires)
  #
  # ⏳ EVERY GEOMETRIC VALUE BELOW IS A PLACEHOLDER. They come from the ultrasound
  # image geometry (probe type, depth scale, sector angles), which is not known.
  roi:
    mode: full                   # full | rect | fan | file
    erode_px: 0                  # drop the interpolated edge of a scan-converted sector
    min_area_ratio: 0.02         # refuse a sliver ROI rather than emit odd scores
    # mode: rect  -- linear probe, image inset in a larger frame
    rect: null                   # [x0, y0, x1, y1] as fractions
    # mode: fan   -- curvilinear / phased, after scan conversion
    apex_xy: null                # [x, y] fractions; y may be negative (apex above image)
    radius_range: null           # [r_min, r_max] fractions of frame height
    half_angle_deg: null         # half the sector opening angle
    # mode: file  -- hand-drawn mask for a geometry none of the above describes
    path: null
  validity:
    min_area_ratio: 0.005
    max_area_ratio: 0.80
    min_segmentation_confidence: 0.50
    max_border_contact_ratio: 0.50
    min_largest_component_ratio: 0.60
    min_temporal_warped_iou: 0.50
    max_centroid_jump: 0.15
    max_relative_area_change: 0.50
    min_lumen_contrast: null
    max_boundary_entropy: null
    min_temporal_stability_score: null
    min_control_quality_score: null
    require_temporal: false
  quality:
    target_area_ratio: 0.15
    area_tolerance: 0.10
    contrast_reference: 0.35
    centroid_jump_scale: 0.05
    area_change_scale: 0.25
    border_penalty_scale: 0.15
    weights:
      segmentation_confidence: 1.0
      mask_completeness: 1.0
      lumen_contrast: 0.5
      border_penalty: 1.0
      component_quality: 1.0
      temporal_iou: 1.0
      centroid_stability: 0.5
      area_stability: 0.5
  stability:
    iou_weight: 1.0
    centroid_weight: 0.5
    area_weight: 0.5
    centroid_jump_scale: 0.05
    area_change_scale: 0.25

  # Q_raw -- segmentation-independent raw B-mode quality. Scores the same frame
  # as `quality:` above but from the raw image alone, so it is defined before
  # the bladder has been found. Consumed by the contact search, not by the
  # in-plane policy.
  #
  # EVERY VALUE HERE IS PROVISIONAL. The depth bands, the darkness threshold and
  # the reference intensity all depend on the ultrasound machine's depth scale,
  # gain, TGC and dynamic range, none of which is known yet. `scan_geometry`
  # must be set to the real probe type before any of this means anything;
  # `sector` is not implemented and raises rather than silently mis-sampling.
  raw_quality:
    scan_geometry: linear          # linear | sector (sector: NOT IMPLEMENTED)
    near_field_fraction: 0.15
    far_field_fraction: 0.35
    near_field_reference: 0.45
    dark_intensity_threshold: 0.10
    shadow_relative_threshold: 0.25
    shadow_reference_percentile: 90.0   # NOT the median: with >50% of A-lines
                                        # shadowed the median IS the shadow level
    shadow_absolute_floor: 0.02         # backstop for uniform shadowing, where
                                        # no unshadowed reference survives
    target_mean_intensity: 0.30
    intensity_tolerance: 0.12
    min_valid_a_lines: 16
    max_dark_a_line_ratio: 0.35
    max_shadowed_a_line_ratio: 0.50
    min_near_field_echo: 0.25
    no_contact_intensity: 0.05
    weights:
      near_field_echo: 1.0
      contact_continuity: 1.5      # highest: a dead A-line is the least
      total_echo_energy: 0.5       # ambiguous evidence of an air gap
      shadow_penalty: 1.0

evaluation:
  # split.ratios 의 test 가 0 이므로 val 에서 평가한다. 여기가 test 로 남아 있으면
  # evaluate.py 가 "Split 'test' is empty" 로 멈춘다 — 두 키는 함께 움직인다.
  split: val
  compute_hd95: true
  pixel_spacing: 1.0             # 1.0 reports HD95 in pixels; set the real
                                 # spacing (mm/px) to report millimetres
  stability_iou_threshold: 0.7
  accuracy_dice_threshold: 0.7

logging:
  level: INFO
