# rus_policy 기본 설정. 모든 키의 의미·근거는 rus_policy/config.py 주석 참조.
# 🟡 = 제안값(튜닝 대상), ⏳ = 실측 후 갱신. 값을 비우면 config.py 의 기본값이 쓰인다.

paths:
  sessions_manifest: policy_learning/data/sessions.csv      # session_dir, subject, source, split, note
  dataset: policy_learning/data/policy_dataset.h5
  output_dir: policy_learning/runs/default
  # 2026-09-10 r6: 팬텀 A 파인튜닝 6 라운드. PFUS 사전학습 → 사람 라벨 234 장
  # (day-1 144 + 에피소드 90) + 완전 접촉 프레임 의사라벨 + 공기 프레임 음성 표본.
  # 홀드아웃 49 장 Dice 0.815 (방광이 있는 40 장만 0.874, 놓침 0).
  #
  # 🔁 2026-09-14 dyn_r1: **다이나믹 팬텀에서 r6 는 눈이 멀었다.** 방광이 또렷한
  # 프레임에도 확률 0.000 을 냈다 (문턱 문제가 아니다 — 0.2 로 내려도 아무것도 없다.
  # 전처리도 학습과 같은 per_image 였다). 도메인 차이라 라벨이 필요했다.
  #
  # 새 라벨 40 장으로 r6 에서 이어 미세조정했다. 40 장은 **실패한 프레임에서만**,
  # 32x32 k-means 로 모양이 겹치지 않게 골랐다 (Unet_seg/scripts/prepare_dynamic_phantom.py).
  # 기존 681 장을 함께 넣어 예전 팬텀을 잊지 않게 했다.
  #
  #                        r6      dyn_r1
  #   새 팬텀 val (10)     0.572 → 0.902   Dice
  #   예전 팬텀 val (22)   0.915 → 0.919   퇴행 없음
  #   예전 팬텀 test (27)  0.660 → 0.653   퇴행 없음
  #   못 보던 구간 검출률   0~38 % → 82~100 %  (라벨 없이 200 장 표본)
  #
  # ⚠️ 위 dyn_r1 수치는 **실행 수준에서 분리되지 않았다.** 프레임은 학습에 안 썼지만
  # 같은 실행(같은 자세·같은 젤)의 다른 프레임을 학습했다. 학습 파이프라인이 실행 단위
  # 분리를 강제하면서 드러났다 (splits.assert_no_patient_leakage).
  #
  # 🔁 2026-09-14 dyn_r2: 경계 프레임 29 장을 더 라벨하고 (닿아 있는데 모델이 0.000 을
  # 내는 프레임 — 그중 진짜 놓친 것은 4 장뿐이고 21 장은 옳은 기권이었다), **실행 단위로
  # 가른 split** 으로 다시 학습했다 (manifest_dyn3.csv: test 10 실행 · val 4 · train 24).
  #
  #   양쪽 모두에게 실행까지 분리된 test 20 장 (양성 12 · 음성 8)
  #                   전체 Dice   양성 Dice   놓침    오탐
  #     dyn_r1          0.938      0.897    0/12    0/8
  #     dyn_r2          0.941      0.902    0/12    0/8
  #
  # 성능은 사실상 같다. dyn_r2 를 쓰는 이유는 **split 이 깨끗해서** 앞으로의 측정을
  # 믿을 수 있기 때문이다. 작은 방광(면적 2.5 % 미만)에서는 0.926 → 0.945 로 조금 낫다.
  #
  # ⚠️ 정책의 상태 벡터는 이 모델이 낸다. policy_dataset.h5 의 지각 특징은 r6 로
  # 구웠으므로, 학습 때 본 입력과 실행 때 받는 입력이 이제 다른 모델에서 나온다.
  # 규칙 제어기·성공 판정·화면은 새 모델이 낫지만, CVAE 정책의 입력 분포는 옮겨진다.
  # 정책을 이 모델에 맞추려면 데이터셋을 다시 굽고 재학습해야 한다.
  #
  # last.pt 를 쓴다 — 검증셋이 작아 best.pt 는 너무 이른 epoch 을 고른다.
  unet_checkpoint: Unet_seg/checkpoints/phantom_dyn_r2/last.pt
  unet_config: Unet_seg/configs/phantom_c10ur_finetune.yaml  # 실측 부채꼴 ROI 포함
  perception_cache_dir: policy_learning/data/perception_cache

timing:
  policy_hz: 5.0          # f_p
  chunk_steps: 8          # k  🟡 (1.6 s)
  # ⏳ m = ceil(f_us / f_dither). f_us 는 가정하지 않는다 — scripts/inspect_session.py 가 세션에서 잰 값과
  # 함께 "m = …" 를 찍어 준다 (§1.3). 16 은 자리표시자 ("8 fps × 2 s") 다. 데이터가 오면 그 값으로 바꾼다.
  obs_frames: 20          # 2026-09-09 실측: C10UR Wi-Fi 9.98 fps → ceil(10 / 0.5) = 20 (첫 세션 us_imu_20260909_153452)
  # 2026-09-10 실측: 프레임간 |ΔI| ↔ 자이로 각속도 상호상관, 268 세션 풀링 피크 +200 ms
  # (r=0.817, 부트스트랩 95% CI [+190,+200], 주입 테스트 오차 0 ms, 실효 불확실도 ±20 ms).
  # 장비 frame persistence 를 포함한 유효 지연이며 순수 전송 지연 스펙이 아니다.
  us_latency_s: 0.2
  obs_frame_max_age_s: 4.0

imu:
  quaternion: chip        # chip (BNO085 RV) | host (Madgwick)
  still_win_s: 0.30
  still_gyro_sd: 0.02     # ⏳ 프리핸드 정지 임계 — inspect_session.py 로 조정
  still_gyro_mean: 0.03
  still_accel_sd: 0.25
  min_still_s: 0.30       # 🟡 §2.3 프로토콜
  max_move_s: 8.0
  min_move_s: 0.15
  anchor_fraction: 0.25
  # R_SP (센서→프로브). 2026-09-10 14:08 전용 회전 세션 실측 (us_imu_20260910_140834):
  #   x 96° / y 83° / z 115°, 주축 사이 각도 93.2 / 92.7 / 97.7°, 투영 잔차 4.20°, det +1.000,
  #   중력 검산 R_SP·a_S = (+0.21, +0.68, −9.71) m/s². 비대각 성분 전부 |0.024| 이하.
  #   (정지 임계를 still_gyro_sd 0.05 / mean 0.08 로 풀어야 세 회전이 분리된다 — 기본 0.02 로는
  #    이 세션의 정지 비율이 1 % 라 구간이 안 잡힌다. 임계 0.05~0.12 에서 결과 동일.)
  # ⚠️ 축 배정은 이전 값(2026-09-10 데이터 기반)과 완전히 일치하나 x, y 의 **부호가 반대**다.
  #   이전 값의 부호 근거는 횡이동 69 세션의 출발 가속 부호 ↔ 영상 라인 이동 부호 146/146 일치였고,
  #   이번 값의 부호는 조작자의 "오른손 양의 방향" 해석에 달려 있다. 둘 다 det +1 (우수계) 이라
  #   마운트가 다른 것이 아니라 회전 방향 규약의 차이다. **정책의 lateral/elevational 부호가 뒤집혀
  #   보이면 여기 x, y 행의 부호를 먼저 뒤집어 볼 것** (이전 값: [0,1,0] / [0,0,1] / [1,0,0]).
  # 🔁 2026-09-14: 위 경고대로 x, y 행의 부호를 **되돌렸다.** 근거 둘, 둘 다 영상을 기준으로 잰다:
  #   1) 프리핸드에서 잰 플랜트 이득 ∂(centroid_dx)/∂θy 가 되돌린 부호에서 **+0.00627/°** 로,
  #      로봇 자기교정 실측 +0.01913/° (runs/probe_rot) 와 **부호가 같다.** 뒤집힌 부호에서는 반대가 되어
  #      정책이 로봇에 지령하는 순간 발산한다. (Spearman +0.883, |θy|>3° 에서 부호일치 97.7%)
  #   2) 되돌린 부호에서 시연자가 안정화 제어기가 된다 — dx>0 에 θy<0 을 내고, |dx|>0.05 에서
  #      출발한 이동의 75.8 % 가 |dx| 를 줄인다 (중앙 0.0920 → 0.0671).
  #   뒤집힌 값의 근거였던 "오른손 양의 방향" 해석은 영상과 대조되지 않은 주관적 판단이었다.
  #   되돌리려면 x, y 행의 부호만 다시 −1 배 하면 된다 (뒤집힌 값: [0,−1,0] / [0,0,−1] / [1,0,0]).
  sensor_to_probe:
    - [0.0, 1.0, 0.0]     #   x_p (lateral)     = 센서 +y
    - [0.0, 0.0, 1.0]     #   y_p (elevational) = 센서 +z
    - [1.0, 0.0, 0.0]     #   z_p (beam)        = 센서 +x   (중력 검산으로 부호까지 확인)
  prev_motion_max_gap_s: 5.0

labels:
  sigma_translation_coeff_mm: 0.7   # ε = c τ^1.5 (QC_PLAN 9번)
  sigma_rotation_deg: 0.1
  sigma_shape_fraction: 0.3         # 🟡
  teleop_sigma_translation_mm: 0.1
  teleop_sigma_rotation_deg: 0.05

perception:
  backend: unet           # unet | none (none: Q̂ 항 마스크, 특징 0)
  frame_size: [256, 256]  # 저장 관측 해상도
  frame_transform: none   # ⏳ candidate 프레임 방향 (rot90_cw 등)
  device: auto
  cache: true
  hold_deadband_px: 8.0916

dataset:                  # 2026-09-08 §8-2 관측 창 증강
  obs_anchor_samples: 3   # 구간당 관측 시각 수 (앵커 + 정지 A 안 2개). 1 이면 증강 없음
  obs_anchor_min_still_s: 0.15
  obs_anchor_seed: 0
  require_chunk_covers_move: false   # true 면 이동이 chunk 창을 넘는 구간을 버린다

offset_filter:            # §3.9 (2026-09-08 채택) — elevational 은 학습이 아니라 추정. 전부 🟡
  d_range_mm: 30.0
  d_step_mm: 0.5
  R_grid_mm: [30.0, 40.0, 50.0, 60.0, 75.0, 90.0]   # 방광 elevational 반축 후보
  A0_grid: [0.85, 1.0, 1.15]                        # 세션 정규화의 오차
  sigma_q: 0.03           # ⏳ 정규화 면적의 프레임간 잡음 (호흡·변형 포함). 사각지대 ≈ snr·σ_q·R²/(2Δ_max)
  process_coeff_mm: 0.7   # c·τ^1.5 (라벨 σ 와 같은 식)
  process_tau_s: 1.6
  process_floor_mm: 0.5
  converge_std_mm: 2.0
  probe_snr: 2.0
  min_probe_mm: 1.0
  max_probe_mm: 8.0
  bimodal_min_mass: 0.2

split:
  strategy: manifest      # manifest | subject_random
  # 팬텀 1 개 파일럿이라 피험자가 하나다 — split 은 세션(에피소드) 단위로만 나뉜다.
  # 즉 val/test 는 일반화가 아니라 같은 팬텀에서의 재현성을 잰다.
  allow_subject_overlap: true
  ratios: [0.7, 0.15, 0.15]
  seed: 42

model:
  head: cvae              # cvae | discrete (§9-1)
  # 2026-09-08: 첫 실데이터 런용 소형 (≈2 M). 큰 모델: --set model.d_model=256 model.encoder_layers=4 ...
  d_model: 128
  n_heads: 8
  encoder_layers: 2
  decoder_layers: 2
  dim_feedforward: 512
  dropout: 0.1
  z_dim: 4                # z 용량 = 누설 상한 (§5.3g 2026-09-08). z 는 디코더 쿼리에만 들어간다
  frame_channels: [32, 64, 128, 256]
  frame_input_size: [128, 128]
  # 2026-09-10: 실측 라벨 산포가 σ 27mm 라 ±20mm 로는 상당수가 표현 범위 밖이었다.
  # ±80mm(≈3σ)로 넓히고 빈 폭 4mm 를 유지하도록 개수도 올린다. config.py 기본값과 같은 값.
  discrete_bins: 41
  discrete_range_mm: 80.0
  discrete_range_deg: 10.0

loss:                     # §5.4 (전부 🟡)
  lambda_force: 0.3
  # 2026-09-10 λ 스윕 (25 epoch, n=575): Q̂ 순위상관 ρ 가 1e2 에서 +0.150(p≈3e-4) 로 최고.
  # 10 → +0.135, 1e3 → +0.106, 1 → +0.050(유의하지 않음). 근거는 scripts/diag_quality.py.
  lambda_quality: 100.0
  lambda_smooth: 0.05
  lambda_feas: 0.5
  lambda_risk: 0.2
  w_minus_over_plus: 5.0
  beta_kl: 0.5            # 2026-09-08: {0.1, 0.5, 1, 5} 스윕. 규칙: val/leak_gap_mm ≤ σ_net 이면서 vy_std > 0 인 최소 β
  w_shape: 0.3
  huber_delta_sigma: 2.0
  B_z: 1000.0
  v_z_max_mm_s: 10.0
  net_weight_cap: 400.0

train:
  epochs: 50
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 2
  beta_warmup_epochs: 5   # KL 워밍업 0 → beta_kl (선형)
  amp: false
  device: auto
  num_workers: 0
  seed: 0
  grad_clip: 1.0
  z_samples_eval: 32
  gamma_mode_consistency: 0.2
  log_every: 20
  augment: true
