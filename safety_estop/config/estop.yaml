# 비상정지·보호정지 문턱 — 단일 진실 공급원
#
# probe.yaml 과 **따로** 둔다. 제어 설정과 안전 문턱이 한 파일에 있으면, 제어를
# 고치다가 문턱이 함께 움직이고 그 변경은 diff 에서 제어 변경처럼 보인다.
#
# 여기 값과 probe.yaml 의 safety 절은 **다른 층**이다. 겹치지 않는다:
#
#   probe.yaml  safety.max_contact_force_n (5.0)   한계 초과 → 조절기가 **후퇴**한다
#                                                  (제어 안에서, 프로빙을 계속하며)
#   이 파일     estop.force_trip_n        (8.0)   → 자율 동작을 **끝낸다**. 래치되고,
#                                                  초기 자세로 복귀해야 다시 쓴다
#
# 즉 5 N 은 "너무 세게 눌렀으니 빼라", 8 N 은 "제어가 그것을 못 했다". 두 번째 층이
# 첫 번째 층 **아래**에 있으면 (문턱이 더 낮으면) 평범한 후퇴마다 세션이 끝난다.
# 반대로 너무 멀면 제어 실패를 한참 지나서 잡는다. 3 N 의 간격은 팬텀 기준이고,
# 조직으로 갈 때 probe.yaml §2.1 의 7 N 과 함께 다시 정해야 한다.
#
# ⏳ 이 값들은 **아직 고장 시험으로 검증되지 않았다.** 문서 §5 의 주입 시험
# (센서 단절·영상 정지·통신 지연·힘 초과·전원 복구)에서 정지까지의 시간·이동거리·
# 최대 힘을 재고, 그 결과로 돌아와 고칠 자리다.

/**:
  ros__parameters:

    robot:
      name: fr5_right

    # ---- 물리 비상정지 회로 --------------------------------------------
    hardware:
      # 래칭형 버튼이 컨트롤러 안전입력에 **실제로** 물려 있는가 (README §1).
      #
      # false 로 두면 노드는 기동 로그에 "이 스택에는 비상정지가 없다" 를 띄우고,
      # 콘솔도 그 사실을 계속 보여 준다. 끄고 켤 수 있게 둔 것은 하드웨어가
      # 붙기 전의 팬텀 벤치 때문이지, 사람 앞에서 쓰라는 뜻이 아니다.
      #
      # true 로 바꾸면 안전입력 읽기가 끊기는 것만으로 운동이 금지된다 —
      # 회로가 있다고 선언한 이상, 그 회로를 못 보는 것은 고장이다.
      present: false

    # ---- 정지 문턱 (콘솔이 고치는 둘 + 천장) ----------------------------
    estop:
      update_hz: 50.0
      state_hz: 10.0

      # 보상된 접촉력 토픽. telemetry_bridge 가 내는 프로브 프레임 값이다 —
      # 보상 전 값으로 판정하면 자중(자세에 따라 ±8 N)이 문턱을 넘나든다.
      wrench_topic: wrench_px6d

      # ‖F‖ 가 이 값을 force_confirm_s 동안 넘으면 정지. 콘솔이 고칠 수 있다.
      force_trip_n: 8.0
      # 확인창 없이 즉시. 단발이라도 이 값이면 설명이 필요한 사건이다.
      force_instant_n: 15.0
      # 단발 스파이크로 서지 않기 위한 확인창. 125 Hz 에서 6 표본.
      force_confirm_s: 0.05

      # 관절 여유. 가동범위 중앙에서 한계까지 이만큼 썼으면 정지 (trip.py 참조).
      # 0.90 = "90 % 까지 갔다". J2([-265, 85], 중앙 -90°)라면 +67.5° 또는 -247.5°.
      joint_reach_trip: 0.90
      joint_confirm_s: 0.04

      # 센서 신선도. 이보다 오래된 표본은 없는 것으로 본다.
      stale_s: 0.25
      # 끊기면 정지를 걸 것인가. 끄면 그 고장에 대한 보호가 사라진다.
      # ⚠️ 끊긴 뒤의 **자동 후퇴는 어차피 허용하지 않는다** (trip.py 의
      # _RELEASE_ALLOWED). 힘을 못 믿는 상태에서 멈출 조건을 그 힘이 쥐기 때문이다.
      trip_on_stale: true

      # 콘솔이 올릴 수 있는 천장. 여기서만 바뀐다.
      force_ceiling_n: 20.0
      joint_reach_ceiling: 0.98

    # ---- 복귀 운동 ------------------------------------------------------
    #
    # 복귀는 감시를 켠 자세부터 지나온 길을 **역순으로 되밟는다** (recovery.py).
    # MoveJ 가 아니다 — 지금 자세와 홈을 잇는 관절공간 직선이 지나는 카테시안
    # 경로는 아무도 본 적이 없고, 그 선의 출발점은 복부를 향한 프로브다.
    recovery:
      # 접촉이 남아 있는 동안 [°/s]. 느리다. 빼는 중이기 때문이다.
      release_speed_deg_s: 2.0
      # 떨어진 뒤 [°/s]. 자유공간이지만 사람이 지켜보는 속도여야 한다.
      return_speed_deg_s: 8.0
      # 이 아래면 접촉이 풀린 것으로 본다 [N]. probe.yaml 의
      # watchdog.retreat_until_force_n(0.2)보다 보수적으로 잡았다 — 여기서 틀리면
      # 닿은 채로 빨라진다.
      release_force_n: 0.5

      waypoint_tol_deg: 0.5
      gain_per_s: 1.5

      # 물러났는데 힘이 안 떨어지면 더 물러나는 것은 그 고장에 대한 답이 아니다.
      max_release_s: 10.0
      max_return_s: 120.0
      stall_s: 3.0
      stall_deg: 0.2

      # 빵부스러기 간격과 개수. 1° 간격 2000 점이면 최악의 경우 2000° 분량의
      # 경로를 들고 있는다. 넘치면 가장 오래된 것부터 버리고, 버린 순간
      # "초기 자세" 의 뜻이 바뀌므로 콘솔이 그 사실을 표시한다.
      trail_step_deg: 1.0
      trail_max_points: 2000

    # ---- 관절 한계 ------------------------------------------------------
    # probe.yaml 의 safety.joint_limits_deg 와 **같은 값이어야 한다.**
    # 사본인 것이 불편하지만, 안전 노드가 제어 설정 파일을 읽어야만 보호를 할 수
    # 있는 구조도 그만큼 나쁘다. 두 파일이 어긋나면 us_servo 의 한계가 이기고
    # (그쪽이 지령을 자른다), 이쪽은 **더 일찍 또는 더 늦게** 선다.
    # ⏳ 기동 시 두 값을 비교해 어긋나면 거부하는 검사가 아직 없다.
    safety:
      joint_limits_deg:
        lower: [-175.0, -265.0, -160.0, -265.0, -175.0, -165.0]
        upper: [ 175.0,   85.0,  160.0,   85.0,  175.0,  165.0]
