# 초음파 프로브 기하 · F/T 장착 · 페이로드 — 단일 진실 공급원
#
# 이전 스택은 툴 변환을 5개 파일에 하드코딩했고 값이 서로 달랐다 (0.64 / 0.615 / 0.22).
# 여기가 유일한 정의이며, 모든 노드가 이 파일에서 읽는다.
#
# .nan 인 항목은 아직 측정되지 않았다는 뜻이다. 노드는 이를 0 으로 대체하지 않고
# 기동을 거부해야 한다 — 0 으로 채우면 조용히 틀린 기하로 동작한다.
#
# null 이 아니라 .nan 을 쓰는 이유: ROS2 파라미터는 null 을 표현하지 못한다.
# 타입 추론에 실패해 노드 기동 자체가 깨진다.
#
# 참고: legacy_laparoscopic/ 의 값은 복강경 로드 기준이므로 그대로 쓰면 안 된다.

/**:
  ros__parameters:

    # ---- 대상 로봇 ------------------------------------------------------
    robot:
      name: fr5_right
      ip: "192.168.58.3"
      # mock: 하드웨어 없이 구동 (DESIGN_NOTES §12.5)
      # fairino: 실로봇
      backend: mock

    # ---- 툴 변환: J6 → 프로브 접촉면 -------------------------------------
    # +z = 조직 침투 방향(법선), +x = 트랜스듀서 배열 방향(영상면 내 lateral),
    # +y = elevational (영상면 밖).  DESIGN_NOTES §4.1
    tool:
      # [x, y, z] 미터
      j6_to_probe_xyz: [.nan, .nan, .nan]     # CAD 대기
      # [roll, pitch, yaw] 라디안, 고정축 XYZ
      j6_to_probe_rpy: [.nan, .nan, .nan]     # CAD 대기

      # 위 값이 .nan 이면 노드는 기동을 거부한다. 이 플래그를 명시적으로 켜면
      # J6 플랜지를 툴 프레임으로 삼아 도는데, Phase 0 의 자유공간 twist 추종
      # 검증에만 쓴다. 접촉 제어에 켠 채로 쓰면 기하가 틀린다.
      allow_missing_tool: true

    # ---- F/T 센서 -------------------------------------------------------
    ft_sensor:
      # J6 → 센서 원점. wrench 기준점 이동에 필요하다 (DESIGN_NOTES §4.3)
      #   M_probe = M_sensor + r x F,  r = 센서원점 → 접촉면
      # r ~ 0.1 m, F_z ~ 5 N 이면 오프셋 0.5 N·m 로 정렬 신호를 덮는다.
      j6_to_sensor_xyz: [.nan, .nan, .nan]    # 장착 위치 확인 대기
      j6_to_sensor_rpy: [.nan, .nan, .nan]

      # 접촉 법선력의 부호. F_n = sign * F_z^probe, 양수 = 압축.
      # Phase 1 의 첫 검증 항목이다. 반대면 admittance 가 발산한다.
      normal_force_sign: -1.0

      # 데드밴드. 잡음 실측 후 조정한다 (DESIGN_NOTES §8).
      force_deadband_n: 0.1
      moment_deadband_nm: 0.01

    # ---- 페이로드 (중력 보상) --------------------------------------------
    # 이 값이 없으면 Mx/My 자세 정렬이 원리적으로 불가능하다 (DESIGN_NOTES §2.3).
    # ForceSensorAutoComputeLoad 식별 절차로 채운다.
    payload:
      mass_kg: .nan
      cog_xyz: [.nan, .nan, .nan]             # 센서 프레임 기준

    # ---- 안전 한계 ------------------------------------------------------
    safety:
      max_normal_force_n: 7.0                 # 하드 한계
      warn_normal_force_n: 6.0                # 소프트 — 경고 + 상승 금지
      max_moment_nm: 0.3

      # 접촉 중 값. 자유공간 기준 1.5 rad/s 는 과도하다.
      max_joint_vel_rad_s: 0.5
      max_linear_vel_m_s: 0.010
      max_angular_vel_rad_s: 0.2

      # 관절 한계 (도). 이전 스택은 J6 만 ±165 로 하드코딩했다.
      joint_limits_deg:
        lower: [-175.0, -265.0, -160.0, -265.0, -175.0, -165.0]
        upper: [ 175.0,   85.0,  160.0,   85.0,  175.0,  165.0]

    # ---- 워치독 (DESIGN_NOTES §12.2, 2층 구조) ----------------------------
    watchdog:
      # 하위: servo_node. 관절 지령이 끊기면 정지한다. 방향을 모르므로 후퇴하지 않는다.
      joint_cmd_timeout_s: 0.1
      # 상위: diff_ik_node. twist 가 끊기면 프로브 -z 로 후퇴한다.
      twist_timeout_s: 0.1
      joint_state_timeout_s: 0.2
      wrench_timeout_s: 0.05

      retreat_speed_m_s: 0.005
      retreat_until_force_n: 0.2
      # 후퇴 종료 조건이 힘이므로, wrench 가 함께 죽으면 무한히 물러난다.
      # 시간으로 상한을 둔다: 3 s x 5 mm/s = 15 mm.
      max_retreat_s: 3.0

    # ---- Touch 원격조작 (DESIGN_NOTES §10 TELEOP_APPROACH) -----------------
    # 프로파일이 스케일·필터·데드존을 통째로 묶는다. 값 하나만 바꾸면 안 되는 이유는
    # 복강경 자유공간 조작과 초음파 접근 조작의 요구 분해능이 자릿수로 다르기 때문이다.
    # teleop.profile 은 매 주기 읽으므로 조작 중에도 바꿀 수 있다:
    #   ros2 param set /touch_teleop_node teleop.profile us_approach
    teleop:
      profile: us_approach

      # 축별 부호 뒤집개. 아래 매핑에 곱해지기만 하며 매 주기 읽힌다.
      #   ros2 param set /touch_teleop_node teleop.angular_sign "[1.0, -1.0, 1.0]"
      #
      # 축 매핑은 이제 실측이 아니라 **규칙**으로 정해진다 (touch_twist_node.cpp).
      #   스타일러스 촉 방향(-Z) ≡ 프로브 침투 방향(+z),  스타일러스 +X ≡ 프로브 +x
      #   → A0 = diag(+1, -1, -1),  병진·회전 공통
      #   → A  = Rz(tip_roll_deg) · A0        (아래 tip_roll_deg 참조)
      # 아래 부호는 그 위에 곱해지는 예외 처리용이며 기본은 손대지 않는다.
      linear_sign: [1.0, 1.0, 1.0]
      angular_sign: [1.0, 1.0, 1.0]

      # 침투축(프로브 +z) 둘레 회전 [도]. 축 매핑에 남은 마지막 자유도다.
      #   A = Rz(tip_roll_deg) · diag(+1, -1, -1)      병진·회전 공통
      # 촉 ≡ 침투축 을 고정해도 그 축 둘레 회전은 남는다 — 영상면이 플랜지에 대해
      # 어떻게 놓이는지는 프로브가 실제로 장착되어야 정해지기 때문이다.
      #
      # 90 의 배수면 축 정렬이 유지되고, 90° 는 pitch 와 roll 이 맞바뀐 것으로 느껴진다.
      # 단순 축 교환이 아니라 Rz 회전으로 구현하는 이유는 행렬식 +1 을 구조적으로
      # 보장하기 위해서다 (교환은 det=-1 이라 회전이 아니라 거울상이 된다).
      #
      # 2026-08-19 실기 조작으로 pitch·roll 방향 확인됨 — 90.0 이 맞다.
      # yaw 는 아직 미확인이다.
      #
      # 매 주기 읽으므로 조작 중에 바꿔가며 확정할 수 있다:
      #   ros2 param set /touch_teleop_node teleop.tip_roll_deg 0.0
      tip_roll_deg: 90.0

      # 기존 복강경 값. 참조용으로 남긴다.
      laparoscopic:
        linear_scale: 0.6
        angular_scale: 0.6
        filter_alpha: 0.4
        linear_deadzone: 0.001
        angular_deadzone: 0.1

      # 초음파 접근용. 회전 데드존이 핵심이다.
      #   이전(0.1 rad/s x 0.6): 최소 지령 0.060 rad/s / 상한 0.2  →  사용구간  3:1
      #   현재(0.02      x 0.15): 최소 지령 0.003 rad/s / 상한 0.2  →  사용구간 67:1
      # angular_deadzone 은 Touch 장치의 회전 잡음 바닥 위에 있어야 한다. 실측 전이라
      # 추정값이며, 너무 낮으면 손을 멈춰도 프로브가 천천히 흐른다.
      us_approach:
        linear_scale: 0.08          # 손 100 mm/s → EE 8 mm/s
        angular_scale: 0.15         # 손 1 rad/s  → EE 0.15 rad/s

        # filter_alpha: 2026-08-18 실측에서 회전 잡음 분포의 꼬리가 두꺼웠다
        # (p99 가 p95 의 5 배). 꼬리는 데드존으로 못 막는다 — 막으려면 분해능을
        # 버려야 한다. 필터를 무겁게 해서 스파이크 진폭을 줄인다.
        #   alpha 0.25 → 시정수 약 60 ms
        #   alpha 0.12 → 시정수 약 150 ms
        # 접근 단계는 느려도 되므로 (§10.4) 지연을 지불할 여유가 있다.
        filter_alpha: 0.12

        # 데드존: 2026-08-18 실측으로 확정 (30 s × 2 조건, n=1601)
        #
        #                     손 올리고 정지(A)   손 뗌(B)
        #   병진 p95            0.00238           0.00038
        #   회전 p95            0.0495            0.0164
        #
        # 두 가지를 알 수 있다.
        #  1) 주된 잡음원은 장치가 아니라 손이다 (병진 6 배, 회전 3 배)
        #  2) 기존 angular_deadzone 0.02 는 장치 잡음 바닥(B p95=0.0164)에
        #     맞춰져 있었다. 손떨림은 애초에 대상이 아니었다.
        #
        # p99 가 아니라 p95 를 기준으로 삼는다. p99(회전 0.265)로 잡으면
        # 사용 구간이 5:1 로 떨어져, §10.4 가 복강경 값(3.3:1)을 버린 이유를
        # 그대로 반복하게 된다.
        linear_deadzone: 0.002      # A p95 0.00238 과 사실상 동일 — 유지
        angular_deadzone: 0.05      # A p95. 최소 지령 0.0075 rad/s (0.43°/s),
                                    # 사용 구간 26.7 : 1

      # 자유공간 검증용. 프로브도 조직도 없는 단계에서 접촉용 스케일을 쓸 이유가 없다.
      # us_phase0.launch.py 의 freespace:=true 로 함께 켜진다 — 프로파일만 바꾸면
      # safety.max_linear_vel_m_s(0.010) 클램프에 걸려 체감이 달라지지 않는다.
      #
      # 데드존은 손 잡음 특성이므로 us_approach 와 같은 값을 쓴다 (2026-08-18 실측).
      freespace:
        # 2026-08-18 조작 피드백으로 3배 상향 (0.4 → 1.2). 거의 1:1 이다.
        #
        # 2026-08-19 이력 — 값을 되돌린 경위를 남긴다:
        #   1.2 → 6.0 (5배 상향).  단, 이때 us_diff_ik 가 패키지 메타데이터 문제로
        #        죽어 있어 로봇이 아예 안 움직였다. "스케일이 작다" 는 피드백은
        #        실은 IK 부재였고, 스케일과 무관했다.
        #   6.0 → 1.2 (원복).  IK 를 고친 뒤 6.0 으로 실제 조작해 보니 너무 빨랐다.
        #        즉 최초의 1.2 가 과소평가된 값이 아니었다.
        linear_scale: 1.2           # 손 100 mm/s → EE 120 mm/s
        angular_scale: 1.2
        filter_alpha: 0.3           # 자유공간은 지연이 적은 쪽이 낫다
        linear_deadzone: 0.002
        angular_deadzone: 0.05

    # ---- US 프레임그래버 (DESIGN_NOTES §3) ---------------------------------
    # 장비는 자기 AP 에서만 영상을 낸다. host 는 그 AP 안의 주소이며
    # robot.ip(192.168.58.3, 유선 robot-net)와는 완전히 다른 망이다.
    #
    # 실측 8 fps 다 (2026-08-06 PCAP: 128블록 런이 초당 약 7.97회).
    # 아키텍처 그림의 30 Hz 는 이 장비에는 해당하지 않는다.
    us:
      host: "192.168.1.1"
      video_port: 5002
      control_port: 5003
      topic: "/us/image"
      frame_id: "us_image"

      # 방향 보정: none | rot90_ccw | rot90_cw | rot180
      #
      # FrameBridge 출력과 대조 검증되기 전까지 "none" 을 유지한다. 검증 안 된
      # 변환을 데이터 경로에 넣으면 하류 세그멘테이션과 기하가 조용히 틀어진다.
      # 확인은 뷰어 쪽 슬라이더로 먼저 하고, 확정된 뒤에 여기에 적는다.
      orientation: "none"

      reconnect_period_s: 2.0
      # 이 시간 동안 프레임이 없으면 경고한다. 장비가 스캔 상태가 아니거나
      # Windows 앱이 AP 를 점유하고 있는 경우가 대부분이다.
      stale_timeout_s: 2.0
      report_period_s: 5.0

    # ---- 루프 주기 (DESIGN_NOTES §11) -------------------------------------
    rates:
      servo_hz: 125.0
      cartesian_hz: 100.0
      wrench_publish_hz: 100.0
      status_publish_hz: 30.0

    # ---- 역기구학 -------------------------------------------------------
    ik:
      # DLS 로 상위 아키텍처를 먼저 검증한다. QP 는 보류 (DESIGN_NOTES §9).
      solver: dls
      dls_damping: 0.02
      # 축별 추종오차 임계. 힘축이 조용히 뭉개지는 것을 잡는다.
      tracking_error_linear_m_s: 0.002
      tracking_error_angular_rad_s: 0.05

    # ---- mock 백엔드 전용 -------------------------------------------------
    # 실패 경로는 실로봇에서 일부러 일으키기 곤란하므로 여기서 주입한다.
    mock:
      # 프로브가 이 깊이(base +z 기준, 미터)보다 아래로 내려가면 접촉으로 친다.
      contact_plane_z: 0.30
      # 합성 접촉 강성 [N/m]. 침투 깊이에 비례한 F_z 를 낸다.
      contact_stiffness_n_m: 2000.0
      ft_noise_std_n: 0.02
      # 주입 실패 (0 = 비활성)
      drop_wrench_after_s: 0.0
      freeze_state_after_s: 0.0
