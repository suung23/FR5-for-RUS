# 초음파 프로브 기하 · F/T 장착 · 페이로드 — 단일 진실 공급원
#
# 이전 스택은 툴 변환을 5개 파일에 하드코딩했고 값이 서로 달랐다 (0.64 / 0.615 / 0.22).
# 여기가 유일한 정의이며, 모든 노드가 이 파일에서 읽는다.
#
# .nan 인 항목은 아직 측정되지 않았다는 뜻이다. 노드는 이를 0 으로 대체하지 않고
# 기동을 거부해야 한다 — 0 으로 채우면 조용히 틀린 기하로 동작한다.
#
# null 이 아니라 .nan 을 쓰는 이유: ROS2 파라미터는 null 을 표현하지 못한다.
# 타입 추론에 실패해 노드 기동 자체가 깨진다.
#
# 참고: legacy_laparoscopic/ 의 값은 복강경 로드 기준이므로 그대로 쓰면 안 된다.

/**:
  ros__parameters:

    # ---- 대상 로봇 ------------------------------------------------------
    robot:
      name: fr5_right
      ip: "192.168.58.3"
      # mock: 하드웨어 없이 구동 (DESIGN_NOTES §12.5)
      # fairino: 실로봇
      backend: mock

    # ---- 툴 변환: J6 → 프로브 접촉면 -------------------------------------
    # +z = 조직 침투 방향(법선), +x = 트랜스듀서 배열 방향(영상면 내 lateral),
    # +y = elevational (영상면 밖).  DESIGN_NOTES §4.1
    tool:
      # [x, y, z] 미터
      j6_to_probe_xyz: [.nan, .nan, .nan]     # CAD 대기
      # [roll, pitch, yaw] 라디안, 고정축 XYZ
      j6_to_probe_rpy: [.nan, .nan, .nan]     # CAD 대기

      # 위 값이 .nan 이면 노드는 기동을 거부한다. 이 플래그를 명시적으로 켜면
      # J6 플랜지를 툴 프레임으로 삼아 도는데, Phase 0 의 자유공간 twist 추종
      # 검증에만 쓴다. 접촉 제어에 켠 채로 쓰면 기하가 틀린다.
      allow_missing_tool: true

    # ---- F/T 센서 -------------------------------------------------------
    ft_sensor:
      # J6 → 센서 원점. wrench 기준점 이동에 필요하다 (DESIGN_NOTES §4.3)
      #   M_probe = M_sensor + r x F,  r = 센서원점 → 접촉면
      # r ~ 0.1 m, F_z ~ 5 N 이면 오프셋 0.5 N·m 로 정렬 신호를 덮는다.
      j6_to_sensor_xyz: [.nan, .nan, .nan]    # 장착 위치 확인 대기
      j6_to_sensor_rpy: [.nan, .nan, .nan]

      # 접촉 법선력의 부호. F_n = sign * F_z^probe, 양수 = 압축.
      # Phase 1 의 첫 검증 항목이다. 반대면 admittance 가 발산한다.
      normal_force_sign: -1.0

      # 데드밴드. 잡음 실측 후 조정한다 (DESIGN_NOTES §8).
      force_deadband_n: 0.1
      moment_deadband_nm: 0.01

    # ---- 페이로드 (중력 보상) --------------------------------------------
    # 이 값이 없으면 Mx/My 자세 정렬이 원리적으로 불가능하다 (DESIGN_NOTES §2.3).
    # ForceSensorAutoComputeLoad 식별 절차로 채운다.
    payload:
      mass_kg: .nan
      cog_xyz: [.nan, .nan, .nan]             # 센서 프레임 기준

    # ---- 안전 한계 ------------------------------------------------------
    safety:
      max_normal_force_n: 7.0                 # 하드 한계
      warn_normal_force_n: 6.0                # 소프트 — 경고 + 상승 금지
      max_moment_nm: 0.3

      # 접촉 중 값. 자유공간 기준 1.5 rad/s 는 과도하다.
      max_joint_vel_rad_s: 0.5
      max_linear_vel_m_s: 0.010
      max_angular_vel_rad_s: 0.2

      # 관절 한계 (도). 이전 스택은 J6 만 ±165 로 하드코딩했다.
      joint_limits_deg:
        lower: [-175.0, -265.0, -160.0, -265.0, -175.0, -165.0]
        upper: [ 175.0,   85.0,  160.0,   85.0,  175.0,  165.0]

    # ---- 워치독 (DESIGN_NOTES §12.2, 2층 구조) ----------------------------
    watchdog:
      # 하위: servo_node. 관절 지령이 끊기면 정지한다. 방향을 모르므로 후퇴하지 않는다.
      joint_cmd_timeout_s: 0.1
      # 상위: diff_ik_node. twist 가 끊기면 프로브 -z 로 후퇴한다.
      twist_timeout_s: 0.1
      joint_state_timeout_s: 0.2
      wrench_timeout_s: 0.05

      retreat_speed_m_s: 0.005
      retreat_until_force_n: 0.2
      # 후퇴 종료 조건이 힘이므로, wrench 가 함께 죽으면 무한히 물러난다.
      # 시간으로 상한을 둔다: 3 s x 5 mm/s = 15 mm.
      max_retreat_s: 3.0

    # ---- Admittance (DESIGN_NOTES §8) --------------------------------------
    # 감쇠 지배형. 질량항은 생략한다 — 접촉 안정성에 가장 견고하고 튜닝할 값이 하나다.
    #   v = clamp( (목표 − 측정) / B , ±상한 )
    admittance:
      damping_linear_ns_m: 1000.0      # B_z: 1 N 오차 → 1 mm/s
      damping_angular_nms_rad: 0.5     # B_r: 0.05 N·m → 0.1 rad/s (≈5.7 °/s)

      # 모멘트 → 회전 방향 부호. ⏳ 실기 검증 대상.
      # 틀리면 정렬 루프가 오정렬을 **키우는** 방향으로 돈다. F_n 부호와 함께 확인한다.
      moment_sign: 1.0

      # supervisor 없이 단독 기동할 때 쓰는 모드 (idle|teleop|contact|retreat).
      # 한 번이라도 /supervisor/mode 를 받으면 그 뒤부터는 두절 시 발행을 멈춘다 —
      # 감독자가 죽었는데 마지막 모드로 계속 도는 것이 가장 위험하다.
      default_mode: contact
      mode_timeout_s: 0.5

    # ---- 프레임 취득 (DESIGN_NOTES §3.1) ------------------------------------
    # source 가 숫자면 장치 인덱스, 아니면 파일 경로. 녹화 영상으로 Stage 1 전 구간을
    # 하드웨어 없이 돌릴 수 있어야 한다.
    frame:
      source: "0"
      fps: 30.0
      loop: true                     # 파일 소스일 때만 의미가 있다
      width: 0                       # 0 이면 장치 기본값
      height: 0
      frame_id: us_probe

    # ---- 지각 (DESIGN_NOTES §13.3) ------------------------------------------
    # 계산은 전부 rus_perception 이 한다. 노드는 얇은 래퍼다.
    perception:
      checkpoint: ""                 # 필수. 없으면 노드가 기동을 거부한다
      reset_gap_s: 0.5               # 프레임이 이만큼 끊기면 시간축 상태를 버린다

    # ---- 원시 품질 Q_raw (DESIGN_NOTES §6.2) ---------------------------------
    # ⏳ US 영상 기하 확정 후 갱신. 지금은 라이브러리 기본값이다.
    raw_quality:
      scan_geometry: linear
      near_field_fraction: 0.15
      far_field_fraction: 0.35
      dark_intensity_threshold: 0.10
      shadow_relative_threshold: 0.25

    # ---- Stage 1 힘 탐색 (DESIGN_NOTES §7) ----------------------------------
    # 램프는 여기서 하지 않는다 — admittance 의 setpoint.force_slew_n_s 가 수행한다.
    search:
      rate_hz: 50.0
      force_step_n: 0.5              # 1a 격자. 1.0→7.0 N 이면 13점
      refine_span_n: 1.0             # 1b 는 1a 결과 ±이 값만
      refine_step_n: 0.25

      # ⚠️ 정착과 측정을 분리한다.
      # τ = B_z/k = 1000/2000 = 0.5 s, 95% 정착에 1.5 s. 홀드 1.0 s 전체를 평균하면
      # 아직 도달하지 않은 힘에서 품질을 재게 된다.
      settle_tolerance_n: 0.05
      settle_hold_s: 0.2             # 허용 오차 안에 머물러야 하는 시간
      settle_timeout_s: 3.0          # 초과하면 그 레벨은 측정 실패
      measure_window_s: 1.0          # 정착 후 품질 수집

      min_valid_fraction: 0.6        # 유효 프레임 비율 미달 시 측정 실패 (§6.3)
      epsilon: 0.03                  # 품질 동률 허용치 — 최소 힘 선택의 핵심
      early_stop_drop: 0.15          # 진행 최댓값 대비 이만큼 낮으면 열화
      early_stop_count: 3            # 열화 연속 횟수 → 상승 중단

    # ---- 감독기 (DESIGN_NOTES §10) -----------------------------------------
    supervisor:
      rate_hz: 20.0
      contact_force_n: 0.5           # 접촉으로 인정할 최소 힘
      contact_hold_s: 0.2
      q_raw_enter_focus: 0.6         # STAGE1A → 1B
      valid_frames_enter_focus: 10
      invalid_frames_leave_scan: 15  # ≈0.5 s @ 30 Hz
      q_raw_degrade_ratio: 0.25      # 재탐색 트리거
      q_raw_degrade_hold_s: 3.0
      max_recovery_attempts: 2       # 초과하면 TELEOP 로 반환

    # ---- 접촉 setpoint (DESIGN_NOTES §5.4) ---------------------------------
    # policy 는 힘 축을 속도로 지령하지 않고 setpoint 만 옮긴다. 100 Hz 힘 루프가 추종한다.
    #   Stage 1  : force_search_node 의 명시적 격자 탐색이 F_n* 를 정함
    #   Stage 2  : policy 가 (F_n*, M*_x, M*_y) 를 5 Hz 로 냄
    setpoint:
      f_normal_min_n: 1.0
      f_normal_max_n: 7.0              # safety.max_normal_force_n 과 일치해야 한다

      # 모멘트 편향 상한. safety.max_moment_nm(0.3)에 과도응답 여유를 남긴다.
      max_moment_bias_nm: 0.10

      # ⚠️ 슬루 제한은 안전상 필수다.
      # M* 가 계단으로 0.1 N·m 뛰면 ω = 0.1/0.5 = 0.2 rad/s 로 각속도 예산을
      # 한 번에 소진한다. 0.05 N·m/s 로 묶으면 기여분이 0.1 rad/s 가 된다.
      moment_bias_slew_nm_s: 0.05
      force_slew_n_s: 2.0              # Stage 1 램프 속도와 동일

      # 영상 twist 신선도. 초과하면 면내 축을 0 으로 두고 힘 루프만 유지한다.
      us_twist_timeout_s: 0.5

    # ---- Touch 원격조작 (DESIGN_NOTES §10 TELEOP_APPROACH) -----------------
    # 프로파일이 스케일·필터·데드존을 통째로 묶는다. 값 하나만 바꾸면 안 되는 이유는
    # 복강경 자유공간 조작과 초음파 접근 조작의 요구 분해능이 자릿수로 다르기 때문이다.
    # teleop.profile 은 매 주기 읽으므로 조작 중에도 바꿀 수 있다:
    #   ros2 param set /touch_teleop_node teleop.profile us_approach
    teleop:
      profile: us_approach

      # 조작자 twist 는 admittance 를 거쳐 나간다. admittance 가 유일한
      # desired_twist 발행자여야 둘이 다투지 않고, TELEOP 모드에서 6축 통과가 성립한다.
      # 빈 문자열이면 기존 동작(/fr5_{side}/desired_twist 직접 발행) — 복강경 듀얼암용.
      twist_topic_override: "/control/teleop_twist"

      # 기존 복강경 값. 참조용으로 남긴다.
      laparoscopic:
        linear_scale: 0.6
        angular_scale: 0.6
        filter_alpha: 0.4
        linear_deadzone: 0.001
        angular_deadzone: 0.1

      # 초음파 접근용. 회전 데드존이 핵심이다.
      #   이전(0.1 rad/s x 0.6): 최소 지령 0.060 rad/s / 상한 0.2  →  사용구간  3:1
      #   현재(0.02      x 0.15): 최소 지령 0.003 rad/s / 상한 0.2  →  사용구간 67:1
      # angular_deadzone 은 Touch 장치의 회전 잡음 바닥 위에 있어야 한다. 실측 전이라
      # 추정값이며, 너무 낮으면 손을 멈춰도 프로브가 천천히 흐른다.
      us_approach:
        linear_scale: 0.08          # 손 100 mm/s → EE 8 mm/s
        angular_scale: 0.15         # 손 1 rad/s  → EE 0.15 rad/s
        filter_alpha: 0.25          # 더 무겁게 — 접근은 느려도 된다
        linear_deadzone: 0.002
        angular_deadzone: 0.02      # ⏳ 장치 잡음 실측 후 확정

    # ---- 루프 주기 (DESIGN_NOTES §11) -------------------------------------
    rates:
      servo_hz: 125.0
      cartesian_hz: 100.0
      wrench_publish_hz: 100.0
      status_publish_hz: 30.0

    # ---- 역기구학 -------------------------------------------------------
    ik:
      # DLS 로 상위 아키텍처를 먼저 검증한다. QP 는 보류 (DESIGN_NOTES §9).
      solver: dls
      dls_damping: 0.02
      # 축별 추종오차 임계. 힘축이 조용히 뭉개지는 것을 잡는다.
      tracking_error_linear_m_s: 0.002
      tracking_error_angular_rad_s: 0.05

    # ---- mock 백엔드 전용 -------------------------------------------------
    # 실패 경로는 실로봇에서 일부러 일으키기 곤란하므로 여기서 주입한다.
    mock:
      # 프로브가 이 깊이(base +z 기준, 미터)보다 아래로 내려가면 접촉으로 친다.
      contact_plane_z: 0.30
      # 합성 접촉 강성 [N/m]. 침투 깊이에 비례한 F_z 를 낸다.
      contact_stiffness_n_m: 2000.0
      ft_noise_std_n: 0.02
      # 주입 실패 (0 = 비활성)
      drop_wrench_after_s: 0.0
      freeze_state_after_s: 0.0
