<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" role="img" aria-label="프로브 좌표계: 원점은 접촉면 중심, x는 배열 방향, z는 깊이, y는 elevational. 영상면은 y=0인 x–z 평면.">
  <title>프로브 좌표계와 영상면</title>
  <style>
    svg{--surface:#FFFFFF;--panel:#F4F8F7;--ink:#15211F;--ink2:#394A47;--muted:#697B78;--hair:#D5DEDC;
        --in:#0B7A67;--in-soft:rgba(11,122,103,.10);--out:#B0452B;--out-soft:rgba(176,69,43,.10);
        --sans:system-ui,"Noto Sans CJK KR","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
        --mono:"DejaVu Sans Mono","JetBrains Mono",ui-monospace,monospace;}
    @media (prefers-color-scheme:dark){
      svg{--surface:#171F1D;--panel:#131A19;--ink:#E7EEEC;--ink2:#BDCAC7;--muted:#8A9C99;--hair:#2B3936;
          --in:#4CD5B8;--in-soft:rgba(76,213,184,.15);--out:#F0906F;--out-soft:rgba(240,144,111,.15);}
    }
    .bg{fill:var(--surface)}
    .s-fg{stroke:var(--ink)} .s-mut{stroke:var(--muted)} .s-hair{stroke:var(--hair)}
    .s-in{stroke:var(--in)} .s-out{stroke:var(--out)}
    .f-in{fill:var(--in-soft)} .f-out{fill:var(--out-soft)}
    .f-surf{fill:var(--surface)} .f-panel{fill:var(--panel)}
    .mk-fg{fill:var(--ink)} .mk-mut{fill:var(--muted)} .mk-in{fill:var(--in)} .mk-out{fill:var(--out)}
    .t{font-family:var(--sans);font-size:12px;fill:var(--ink2)}
    .tm{font-family:var(--mono);font-size:12.5px;fill:var(--ink)}
    .tmu{font-family:var(--sans);font-size:11px;fill:var(--muted)}
    .tin{fill:var(--in)} .tout{fill:var(--out)}
    .tt{font-family:var(--mono);font-size:14px;font-weight:500}
    .no-fill{fill:none}
  </style>
  <defs>
    <marker id="ar-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-fg"/></marker>
    <marker id="ar-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-mut"/></marker>
    <marker id="ar-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-in"/></marker>
    <marker id="ar-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-out"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="700" height="400"/>
      <!-- skin -->
      <polygon points="150.4,111.6 426.4,111.6 509.6,188.4 233.6,188.4" class="f-panel s-hair" stroke-width="1"/>
      <text x="518" y="192" class="tmu">피부면 (x–y)</text>

      <!-- slice thickness ghosts -->
      <rect x="218.2" y="157.2" width="239.2" height="156.4" class="no-fill s-mut" stroke-width="1" stroke-dasharray="2 4" opacity=".55"/>
      <rect x="202.6" y="142.8" width="239.2" height="156.4" class="no-fill s-mut" stroke-width="1" stroke-dasharray="2 4" opacity=".55"/>

      <!-- image plane -->
      <rect x="210.4" y="150" width="239.2" height="156.4" class="f-in s-in" stroke-width="1.6"/>
      <!-- sector fan -->
      <path d="M 265.6 150 L 394.4 150 L 440.4 288 Q 330 316 219.6 288 Z" class="no-fill s-in" stroke-width="1.1" opacity=".7"/>

      <!-- probe body -->
      <polygon points="272.7,91.8 410.7,91.8 387.3,70.2 249.3,70.2" class="f-panel s-fg" stroke-width="1.3"/>
      <polygon points="410.7,91.8 410.7,160.8 387.3,139.2 387.3,70.2" class="f-panel s-fg" stroke-width="1.3"/>
      <rect x="272.7" y="91.8" width="138" height="69" class="f-surf s-fg" stroke-width="1.3"/>
      <text x="341.7" y="122" class="tmu" text-anchor="middle">프로브</text>
      <text x="341.7" y="136" class="tmu" text-anchor="middle">(배열 = x 방향)</text>

      <!-- axes -->
      <line x1="330" y1="150" x2="486.4" y2="150" class="s-fg" stroke-width="1.8" marker-end="url(#ar-fg)"/>
      <line x1="330" y1="150" x2="330" y2="329.4" class="s-fg" stroke-width="1.8" marker-end="url(#ar-fg)"/>
      <line x1="330" y1="150" x2="392.4" y2="207.6" class="s-out" stroke-width="4.5" opacity=".001"/>
      <line x1="330" y1="150" x2="392.4" y2="207.6" class="s-out" stroke-width="2.2" marker-end="url(#ar-out)"/>
      <circle cx="330" cy="150" r="3.6" class="mk-fg"/>

      <text x="494" y="146" class="tm">x</text>
      <text x="494" y="162" class="tmu">lateral · 배열 방향</text>
      <text x="330" y="348" class="tm" text-anchor="middle">z</text>
      <text x="330" y="363" class="tmu" text-anchor="middle">depth · 빔 방향</text>
      <text x="400" y="212" class="tm tout">y</text>
      <text x="400" y="228" class="tmu">elevational · 면 밖</text>

      <text x="206" y="300" class="tm tin" text-anchor="end">Π = { y = 0 }</text>
      <text x="206" y="316" class="tmu" text-anchor="end">B-mode 영상면</text>
      <text x="330" y="30" class="tmu" text-anchor="middle">원점 = 접촉면 중심 · §4.2 툴 변환이 이 점을 결정</text>

      <!-- slice thickness bracket -->
      <line x1="459" y1="313" x2="443" y2="299" class="s-mut" stroke-width="1.2" marker-start="url(#ar-mut)" marker-end="url(#ar-mut)"/>
      <text x="466" y="322" class="tmu">슬라이스 두께</text>
    </svg>
