# 초음파 프로브 기하 · F/T 장착 · 페이로드 — 단일 진실 공급원
#
# 이전 스택은 툴 변환을 5개 파일에 하드코딩했고 값이 서로 달랐다 (0.64 / 0.615 / 0.22).
# 여기가 유일한 정의이며, 모든 노드가 이 파일에서 읽는다.
#
# .nan 인 항목은 아직 측정되지 않았다는 뜻이다. 노드는 이를 0 으로 대체하지 않고
# 기동을 거부해야 한다 — 0 으로 채우면 조용히 틀린 기하로 동작한다.
#
# null 이 아니라 .nan 을 쓰는 이유: ROS2 파라미터는 null 을 표현하지 못한다.
# 타입 추론에 실패해 노드 기동 자체가 깨진다.
#
# 참고: legacy_laparoscopic/ 의 값은 복강경 로드 기준이므로 그대로 쓰면 안 된다.

/**:
  ros__parameters:

    # ---- 대상 로봇 ------------------------------------------------------
    robot:
      name: fr5_right
      ip: "192.168.58.3"
      # mock: 하드웨어 없이 구동 (DESIGN_NOTES §12.5)
      # fairino: 실로봇
      backend: mock

    # ---- 툴 변환: J6 → 프로브 접촉면 -------------------------------------
    # +z = 조직 침투 방향(법선), +x = 트랜스듀서 배열 방향(영상면 내 lateral),
    # +y = elevational (영상면 밖).  DESIGN_NOTES §4.1
    tool:
      # ✅ 2026-08-27. 적층은 플랜지 → 마운트① → PX6D → 마운트② → 프로브 이고
      # **전부 동축** 이다 (프로브 배열 면이 브래킷과 같은 방향, 아래를 본다).
      #
      #   마운트①  10 mm      플랜지 → 센서 바닥          실측
      #   PX6D     23 mm      → 누적 33 mm                실측 (= ft_sensor 의 z)
      #   마운트②  152 mm     긴 검은 브래킷              **CAD**
      #   프로브    49 mm      브래킷 끝 → 배열 면 중심    실측
      #   ─────────────────
      #   합계     234 mm
      #
      # 마운트② 는 **CAD 가 이긴다** (2026-08-27, 조작자 판단). 처음 실측은 161 mm
      # 였는데 공급된 솔리드(본체3.stl)가 152.0 mm 로 나왔다. 실측 도구가 없는 두
      # 구간(마운트①·PX6D)만 실측을 쓰고, 솔리드가 있는 구간은 솔리드를 쓴다.
      # 결과로 툴 길이가 243 → 234 mm 로 9 mm 줄었다.
      #
      # ⏳ 다만 **프로브 삽입 깊이는 CAD 로도 못 정한다.** 클램프는 매끈한 채널이라
      # 프로브가 미끄러진다. CAD 상의 유일한 하드 스토퍼는 케이블 꼬리 대 중앙
      # 보어(Ø11 mm)이고, 그것을 풀면 노출이 72 mm(총 257 mm)로 나온다 — 실측
      # 49 mm 와 20 mm 넘게 차이가 난다. 그래서 이 구간은 실측을 유지했다.
      # 본체3.stl 이 지금 팔에 달린 그 브래킷의 개정판이 맞는지 확인할 것.
      #
      # 값을 넣으면 us_diff_ik 가 **프로브 끝을 중심으로 회전한다.** 그 전에는
      # allow_missing_tool 로 플랜지를 중심으로 돌았고, 프로브가 234 mm 밖에
      # 있으므로 같은 회전 지령이 프로브를 크게 휘둘렀다 — "회전이 둔하다" 의
      # 정체가 이것이다.

      # [x, y, z] 미터
      j6_to_probe_xyz: [0.0, 0.0, 0.234]

      # [roll, pitch, yaw] 라디안, 고정축 XYZ
      #
      # ✅ 2026-08-27 yaw 확정: **+90° (1.5708 rad)**. 배열 장축(+x_P)이 플랜지 +x
      # 에서 +90° 돌아가 있다. roll·pitch 는 0 이다 — 적층이 동축이므로 +z_P 가
      # 플랜지 +z 와 나란하다.
      #
      # 서로 독립인 두 갈래가 같은 값을 가리킨다.
      #  1) 조작자 실측 (2026-08-27): 플랜지 기준 프로브 각도 90°.
      #  2) teleop 실기 (2026-08-19): tip_roll_deg = 90 이 맞다고 확인됐다. 그때
      #     IK 의 툴 프레임은 플랜지였으므로(allow_missing_tool), A = Rz(90°)·A0 의
      #     그 Rz(90°) 가 곧 손으로 찾아낸 '플랜지 → 프로브' 회전이다. 같은 90° 를
      #     다른 방법으로 두 번 잰 셈이다.
      #
      # ⚠️ **teleop.tip_roll_deg 와 반드시 함께 움직인다.** 두 값은 같은 회전을
      # 서로 다른 자리에서 표현한 것이라, 한쪽만 넣으면 Rz(90°)가 두 번 곱해져
      # 지령 방향이 90° 틀어진다 — 스타일러스 +X 가 프로브 +x(영상면 내)가 아니라
      # +y(elevational)로 간다. 여기 +90° 를 넣었으므로 tip_roll_deg 는 0 이다
      # (아래 teleop 절).
      #
      # 센서 기준 프로브 각도는 이것과 별개의 실측이다 — 채널 프레임에서 +43.0°
      # (px6d_axis_id, log/axis_id_run2·3). 둘이 합쳐져 아래 j6_to_sensor_rpy 의
      # yaw = 90 − 43 = **+47°** 를 준다.
      j6_to_probe_rpy: [0.0, 0.0, 1.5708]

      # 위 값이 .nan 이면 노드는 기동을 거부한다. 이 플래그를 명시적으로 켜면
      # J6 플랜지를 툴 프레임으로 삼아 도는데, Phase 0 의 자유공간 twist 추종
      # 검증에만 쓴다. 접촉 제어에 켠 채로 쓰면 기하가 틀린다.
      #
      # 2026-08-27: 값이 들어왔으므로 이 플래그는 더 이상 쓰이지 않는다.
      allow_missing_tool: false

    # ---- F/T 센서 -------------------------------------------------------
    ft_sensor:
      # J6 → 센서 원점. wrench 기준점 이동에 필요하다 (DESIGN_NOTES §4.3)
      #   M_probe = M_sensor + r x F,  r = 센서원점 → 접촉면
      # r ~ 0.1 m, F_z ~ 5 N 이면 오프셋 0.5 N·m 로 정렬 신호를 덮는다.
      # ✅ 2026-08-27 실측. tool.j6_to_probe_* 와 **같은 적층에서 나온 값** 이다
      # (마운트① 10 + PX6D 23 = 33 mm). 따로 적어 넣으면 조용히 어긋날 수 있어
      # probe_tcp.compose_stack 이 둘을 한 사슬에서 계산한다.
      #
      # 레버암 r_{S→P} = 234 - 33 = 201 mm 이고 프로브 프레임에서 +z 방향이다.
      # 동축이므로 **축방향 압축은 오프셋 모멘트를 만들지 않는다** (r ∥ f).
      # 다만 횡력에는 길다 — 1.49 N 이면 아래 max_moment_nm(0.3)에 닿는다.
      #
      # ✅ 2026-08-27: 이 201 mm 는 **적어 넣는 값이 아니라 유도되는 값**이다.
      # telemetry_bridge 가 j6_to_sensor_xyz 와 j6_to_probe_xyz 의 차로 계산한다
      # (FrameRegistration.from_stack). 그전까지는 노드가 0 을 들고 있어 모멘트
      # 기준점 이동이 꺼진 채로 돌았다 — 축방향 압축에서는 r ∥ f 라 차이가 0 이라
      # 증상이 없었고, 그래서 오래갔다. 여기 두 수만 맞으면 그쪽은 따라온다.
      j6_to_sensor_xyz: [0.0, 0.0, 0.033]
      # ✅ 2026-08-27 yaw = **+47° (0.8203 rad)**. 실측 둘의 차로 나온다:
      #   플랜지 → 프로브  = +90°   (tool.j6_to_probe_rpy, 조작자 실측 + teleop 실기)
      #   센서   → 프로브  = +43°   (px6d_axis_id, 채널 프레임에서 본 배열 장축)
      #   ⇒ {F}R{S} = {F}R{P}·{P}R{S} = Rz(90°)·Rz(-43°) = Rz(+47°)
      # 즉 PX6D 채널 +x 는 플랜지 +x 에서 +47° (프로브 쪽을 내려다볼 때 반시계).
      #
      # ⏳ 이 값만은 **유도된 것이지 직접 잰 것이 아니다.** 육안으로 한 번 확인할 것 —
      # 47° 냐 아니냐는 눈으로 갈린다. 43° 가 틀렸다면(아래) 이 값은 182° 가 되어,
      # 채널 +x 가 플랜지 +x 의 거의 반대를 향한다. 헷갈릴 수 없는 차이다.
      #
      # ✅ 2026-08-27: telemetry_bridge 가 **이 값을 읽는다.** 그전까지는 노드가
      # registration.flange_to_sensor_rpy 를 따로 들고 있었고 이 파일을 받지도
      # 않아서, 여기 적은 값이 아무 데도 안 닿았다. 이제 브리지가 이 절과
      # tool: 절에서 등록을 유도하고(FrameRegistration.from_stack), 값이 없으면
      # 기동을 거부한다.
      j6_to_sensor_rpy: [0.0, 0.0, 0.8203]

      # ⛔ 저울 기반 접촉력 보정은 **제거했다** (2026-08-31).
      #
      # 2026-08-28 전자저울 비교에서 하중 아래 평균 −0.293 N 이 나왔고 한동안
      # ft_sensor.contact_force_offset_n 으로 되돌렸다. 근거와 수치는
      # force_validation/outputs/ 와 DESIGN_NOTES 에 남아 있다.
      #
      # 뺀 이유는 그것이 **설정값과 실제를 어긋나게 만들기 때문이다.** 보정이 있으면
      # 목표 3.0 N 이 보정 전 스케일로 2.71 N 이 되고 문턱 2.0 이 1.71 N 에서
      # 걸린다. 무엇을 누르고 있는지 말하려면 매번 어느 스케일인지를 함께 말해야
      # 하는데, 조작자가 읽는 화면에서 그것은 값이 하나 더 있는 것이나 같다.
      #
      # 되살리려면 저울 검증을 팬텀 접촉 조건에서 다시 하고 — 축방향 19 점만으로는
      # 횡력이 실린 접촉을 구속하지 못한다 — 그때 문턱과 목표를 함께 환산할 것.

      # 접촉 법선력의 부호. F_n = sign * F_z^probe, 양수 = 압축.
      # Phase 1 의 첫 검증 항목이다. 반대면 admittance 가 발산한다.
      normal_force_sign: -1.0

      # 접촉 판정과 힘 유지가 무엇을 "접촉력" 으로 볼 것인가. 🔁 2026-08-31 신설.
      #
      #   magnitude: ‖F‖ = √(Fx²+Fy²+Fz²). 기본. 방향에 무관하므로 프로브가 기울어
      #              닿아도 잡힌다. 위 contact_probing_force_n: 2.0 은 이것이 전제다.
      #              부호는 F_n 에서 빌린다 — 크기에는 부호가 없어서, 그대로 두면
      #              프로브가 **당겨질 때도** 양수가 되어 접촉으로 잡힌다.
      #   normal:    F_n = sign * F_z. 2026-08-31 이전 거동. 전자저울 검증처럼 축방향
      #              으로만 누르는 절차에서 두 값이 일치하는지 볼 때 쓴다.
      #
      # ⚠️ magnitude 로 잡으면 ‖F‖ ≥ |F_z| 이므로, 횡력이 실릴 때는 z 를 덜 눌러도
      # 목표에 도달한다. 조직에 덜 파고드는 쪽이라 안전한 방향으로 틀리지만, "목표
      # 힘 유지 중" 이 곧 "법선으로 목표만큼 누르는 중" 은 아니다. 콘솔이 총합·법선·
      # 횡력·이탈각을 따로 보여 주는 이유가 이것이다.
      contact_force_mode: magnitude

      # us_diff_ik 가 구독할 wrench 토픽 (로봇 네임스페이스 기준 상대 이름).
      #
      # 기본 `wrench` 는 us_servo 가 컨트롤러에서 읽어 내는 것인데, 우리 PX6D 는 USB
      # 변형이라 컨트롤러에 안 물린다 — 그 토픽은 0 이다. telemetry_bridge 가 센서를
      # 직접 읽어 `wrench_px6d` 로 내므로 그쪽을 본다.
      wrench_topic: wrench_px6d

      # 데드밴드. 잡음 실측 후 조정한다 (DESIGN_NOTES §8).
      force_deadband_n: 0.1
      moment_deadband_nm: 0.01

    # ---- 페이로드 (중력 보상) --------------------------------------------
    # 이 값이 없으면 Mx/My 자세 정렬이 원리적으로 불가능하다 (DESIGN_NOTES §2.3).
    # ForceSensorAutoComputeLoad 식별 절차로 채운다.
    # ---- 텔레메트리 브리지 ----------------------------------------------
    bridge:
      # 교정 만료 [h]. 0 이면 나이를 보지 않는다.
      #
      # 🔁 2026-08-31: 24 → 0. **운영자 판단으로 만료 검사를 껐다** — 센서 영점이
      # 시간에 대해 동일하다는 가정을 따른다.
      #
      # ⚠️ 무엇을 포기했는지 분명히 해 둔다. 기본 24 h 는 "하루면 흐른다" 는 보수적
      # 가정이었고, 이것을 0 으로 두는 것은 "흐르지 않는다" 는 **주장**이다. 그
      # 주장의 근거는 코드가 아니라 관측이어야 한다. 이제 오래된 프로파일이 조용히
      # 접촉력을 지배할 수 있고, 누구도 경고를 받지 않는다.
      #
      # 그래서 관측 책임이 따라온다: 세션 앞에서 `ros2 run fr5_control px6d_verify`
      # 로 무접촉 잔차를 확인할 것. 프로브 아래 자세에서 |F_n| 이 0.2 N 을 넘기
      # 시작하면 그것이 흐름의 신호이고, 그때는 재교정이 답이다.
      calibration_stale_after_h: 0.0

    payload:
      mass_kg: .nan
      cog_xyz: [.nan, .nan, .nan]             # 센서 프레임 기준

    # ---- 안전 한계 ------------------------------------------------------
    safety:
      # 🔁 2026-09-02: 15.0 → **5.0** (경고 14.0 → 4.5), 그리고 이름을
      # ``*_normal_force_n`` 에서 ``*_contact_force_n`` 으로 바꿨다.
      #
      # **이름을 바꾼 이유.** 이 한계는 법선력에 걸린 적이 없다. `us_diff_ik` 가
      # `regulator.update(self._control_force())` 로 넘기는 값은
      # `ft_sensor.contact_force_mode: magnitude` 에서 부호 붙은 ‖F‖ 이고,
      # `ForceRegulator.update` 는 그 스칼라 하나를 max 와 warn 에 댄다. 이름이
      # 동작보다 오래돼 있었고, 그런 이름은 읽는 사람을 조용히 틀리게 만든다.
      #
      # **값을 내린 이유.** 이력은 7.0 (§2.1 조직 안전 근거 있음) → 10.0
      # (2026-08-25, 접촉 전환 8 N 과의 모순 해소. 근거 없음) → 15.0 (2026-08-27,
      # 조작자 요청. 근거 없음) 였고, 주석은 "팬텀 접촉 전에 반드시 재정당화할 것"
      # 을 요구하고 있었다. 그 시점이 지금이다.
      #
      # 5.0 은 **도달 가능한 한계** 라는 데서 나온다. 15 N 은 물렁한 팬텀에서 닿을
      # 수 없으므로, 그 값으로는 "한계를 안 넘었다" 가 아니라 "한계 근처에 가 보지도
      # 않았다" 만 얻는다 — 시험되지 않은 보호는 보호가 아니다. 5 N 이면 강제 후퇴가
      # 실제로 걸리는 것을 팬텀에서 확인할 수 있고, 7 N 이라는 조직 안전 근거값보다
      # 아래다.
      #
      # 불변식: target(3.0) < warn(4.5) <= max(5.0). `ForceRegulator.__init__` 이
      # 강제하며, 목표를 올릴 때 warn 도 함께 올라가야 한다.
      #
      # ⏳ 5.0 은 여전히 **팬텀 기준**이다. 조직으로 갈 때 §2.1 로 다시 돌아갈 것.
      max_contact_force_n: 5.0                # 하드 한계 — ‖F‖ 기준, 초과 시 강제 후퇴
      warn_contact_force_n: 4.5               # 소프트 — 경고 + 상승 금지
      max_moment_nm: 0.3

      # 접촉 중 값. 자유공간 기준 1.5 rad/s 는 과도하다.
      max_joint_vel_rad_s: 0.5
      max_linear_vel_m_s: 0.010
      max_angular_vel_rad_s: 0.2

      # ---- 접촉 프로빙 상한 ✅ 2026-08-25 ----
      #
      # us_diff_ik 가 모드 전환 시 갈아 끼우는 값이다. 위의 safety.max_* 는 launch 의
      # freespace 오버라이드가 덮어쓰지만 이쪽은 건드리지 않는다 — 두 벌이 동시에
      # 있어야 런타임에 전환할 수 있다.
      contact:
        max_linear_vel_m_s: 0.010
        max_angular_vel_rad_s: 0.2

      # 관절 가속도 상한 [rad/s^2].
      #
      # 2026-08-20: 자유공간 teleop 중 ServoJ 가 29(ServoJ joint overrun)로 거부되고
      # 이후 모든 호출이 14(Interface execution failed)로 떨어졌다. 원인은 속도 크기가
      # 아니라 **변화율**이었다. 서보는 관절속도 크기만 ±max_joint_vel 로 잘랐고,
      # us_diff_ik 는 DLS 관절속도를 관절공간 제한 없이 그대로 발행한다. 특이점 근처에서
      # DLS(λ=0.02)는 방향이 급변하는 해를 내므로, +1.5 → -1.5 rad/s 가 한 주기(8 ms)에
      # 일어날 수 있다. 크기로는 둘 다 합법이지만 로봇이 낼 수 없는 가속도이며,
      # 컨트롤러는 이를 관절 초과로 거부한다.
      #
      # 8.0 은 0 → 1.5 rad/s 를 약 190 ms 에 도달시키는 값이다. teleop 체감을 해치지
      # 않으면서 한 주기 부호반전을 막는 선으로 잡았다. FR5 의 실제 관절 가속도 한계를
      # 실측한 값은 아니다 — 추종이 굼뜨게 느껴지면 올리고, 29 가 재발하면 내린다.
      max_joint_accel_rad_s2: 8.0

      # 관절 감속 상한 [rad/s^2]. 0 을 향해 **크기만 줄어드는** 변화에 쓴다.
      #
      # 2026-08-21: 자유공간 teleop 에서 "시간이 지나면 손목 조작이 뻣뻣해진다" 를
      # 쫓다가 나온 값이다. 위 가속 상한은 특이점 근처 DLS 해의 **부호 반전**을 막으려고
      # 넣은 것인데, 감속에도 같은 값을 쓰고 있었다. 그 결과 1.5 rad/s 에서 정지에
      # 187 ms 가 걸렸고, 그 사이 관절은 약 8° 를 더 갔다. 손을 멈춘 뒤에 실행되는
      # 각도이므로 조작자에게는 "멈춰도 더 가고, 되돌리려면 그만큼 헛돈다" 로 느껴진다.
      #
      # 부호를 바꾸지 않고 크기만 주는 변화에는 반전 위험이 없다. 24.0 은 가속의 3배로,
      # 1.5 rad/s → 0 을 62 ms / 약 2.7° 로 줄인다. 반전(부호가 바뀌는 변화)은 여전히
      # 위의 가속 상한을 받는다.
      #
      # 오류 29 가 재발하면 여기부터 내린다. 가속 상한보다 작게 잡을 수는 없다
      # (노드가 기동을 거부한다) — 그러면 정지가 가속보다 오래 걸린다.
      max_joint_decel_rad_s2: 24.0

      # 정지 중 "지령 되감기" — 남은 선행분을 실행하지 않고 취소한다.
      #
      # commanded_deg 는 개루프 적분값이고 로봇은 그것을 지연을 두고 따라온다. 그래서
      # 손을 멈춘 시점에 **아직 실행되지 않은 각도**(선행분)가 관절마다 남는다. 예전에는
      # 이것을 없애는 경로가 없어 정지할 때마다 그대로 실행됐다. 아래 추종오차 밴드는
      # 선행분의 크기를 묶을 뿐, 묶인 만큼은 결국 로봇이 실행한다.
      #
      # 정지 상태에서 목표속도를 0 이 아니라 "실제 관절각으로 되돌아가는 속도" 로 준다.
      # 속도·가속도·관절한계를 그대로 통과하므로 되감기 자체가 규격 밖 지령이 되지 않는다.
      #
      #   rate: 되감기 속도 상한 [°/s]. max_joint_vel 을 넘길 수 없다 — 넘겨 적으면
      #         노드가 잘라 쓴다. 자유공간(1.5 rad/s)에서 실효 86 °/s,
      #         접촉(0.5 rad/s)에서 실효 28.6 °/s 다.
      #   gain: P 게인 [1/s]. 선행분이 줄면 되감기 속도도 줄어 지수적으로 붙는다
      #         (시정수 1/gain ≈ 83 ms). 진동 없이 붙는 값으로 잡는다.
      idle_resync_rate_deg_s: 90.0
      idle_resync_gain_per_s: 12.0

      # 지령이 실제 관절각을 앞설 수 있는 최대치 [도].
      #
      # commanded_deg 는 개루프 적분이라 실제값으로 되돌아오는 경로가 없다. 로봇이
      # 못 따라오면 (또는 폴트로 멈추면) 간격이 무한히 벌어지고, 그 상태에서 서보가
      # 살아나면 그 간격이 곧 급발진이다. 실제값 주변 밴드로 묶어 지령이 달아나지
      # 못하게 한다.
      #
      # 1.5 rad/s = 86 도/s 에서 서보 지연 ~20 ms 면 정상 추종오차가 1.7 도다.
      # 5 도는 그 3 배로, 정상 동작은 건드리지 않고 폭주만 잡는 폭이다.
      max_follow_error_deg: 5.0

      # 관절 한계 (도). 이전 스택은 J6 만 ±165 로 하드코딩했다.
      joint_limits_deg:
        lower: [-175.0, -265.0, -160.0, -265.0, -175.0, -165.0]
        upper: [ 175.0,   85.0,  160.0,   85.0,  175.0,  165.0]

    # ---- 접촉 프로빙 힘 제어 (DESIGN_NOTES §7) ✅ 2026-08-25 ---------------
    #
    # 접촉 프로빙 모드에서 **침투축은 로봇이 스스로 잡는다.** 조작자가 누르는 깊이를
    # 맞추는 것이 아니라, 목표 힘 구간에 들어오도록 z 를 움직인다. §7 admittance 의
    # 첫 구현이며, policy 도 QP arbiter 도 아직 없으므로 힘 축 하나만 닫는다.
    contact_control:
      # 🟡 유지할 힘. **임시값이다.** §5 의 설계는 이 값을 Stage 1 힘 탐색이
      # 찾도록 되어 있다 — "최대 품질을 내는 최소 힘". 그 탐색이 구현되기 전까지
      # 고정값을 쓴다. 팬텀 시험에서 조정할 것.
      #
      # 🔁 2026-08-31: 5.0 → 3.0 (조작자 확정), 그리고 **무엇의 N 인지도 바뀌었다** —
      # 법선력 F_n 이 아니라 접촉력 크기 ‖F‖ 다 (ft_sensor.contact_force_mode).
      # 축방향으로 곧게 누르는 동안에는 둘이 같지만, 프로브가 기울면 ‖F‖ ≥ |F_z| 라
      # **같은 3 N 이 더 얕은 침투** 를 뜻한다. 조직에 덜 파고드는 쪽이라 안전한 방향
      # 으로 틀리지만, "3 N 유지 중" 이 곧 "법선으로 3 N 누르는 중" 은 아니다 —
      # 콘솔의 Normal·Shear·Off-axis 셀이 그 차이를 보여 주는 이유가 이것이다.
      #
      # ⚠️ **진입 문턱(1.0)보다 높다.** 즉 접촉이 잡히는 순간부터, 조작자가 아무 지령도
      # 주지 않는 동안 로봇이 스스로 3 N 까지 파고든다. 오차 2 N ÷ B_z 1000 = 2 mm/s
      # 로 시작해 목표에 붙으며 느려진다 (접촉 상한 10 mm/s 에는 안 닿는다).
      #
      # 2026-08-31 이전에는 순서가 반대였다 (문턱 8 > 목표 5): "접촉을 확실히 잡은 뒤
      # 작업 힘으로 내려온다". 지금은 "닿자마자 작업 힘까지 들어간다" 이다. 팬텀 첫
      # 접촉에서 눈으로 확인할 첫 번째 항목이 이것이다.
      target_force_n: 3.0

      # 목표 둘레 밴드 반폭. 이 안에서는 움직이지 않는다.
      #
      # 밴드가 필요한 이유: PX6D 잡음이 축당 ±0.05 N 이고 자중 미보상분이 자세에
      # 따라 1.5 N 가량 움직인다. 순수 비례제어면 프로브가 계속 미세하게 오르내린다.
      #
      # 목표와 한 짝이다. 보상 잔차 0.235 N (2026-08-27 실측) 이 이 반폭의 47 % 이므로
      # 실제 유지 힘은 **2.5~3.5 N** 로 봐야 한다 — 2.8~3.2 를 보증할 수는 없다.
      # 목표가 5 → 3 N 으로 내려오면서 밴드가 목표의 ±10 % 에서 ±17 % 가 됐다. 더
      # 좁히려면 밴드가 아니라 중력보상 잔차부터 줄여야 한다.
      # 🔁 2026-09-02: 0.5 → 0.05. **밴드가 아니라 수렴 허용오차다.**
      #
      # `ForceRegulator.update` 는 |오차| ≤ deadband 이면 v_z = 0 을 낸다. 아래에서
      # 올라오면 밴드 아래끝에 닿는 순간 멈추므로, 0.5 였을 때는 목표 3.0 에서
      # 2.57 N 에 정착했다 (2026-09-02 A_t3p0, A_t4p0 에서 나란히 −0.43 N).
      # 목표는 도달할 점이 아니라 밴드를 정의하는 값이었던 셈이다.
      #
      # 0.05 는 센서 잡음 바닥이다 (축당 ±0.05 N, 실측 유지 SD 0.022~0.065 N).
      # 그보다 좁히면 잡음을 쫓아 계속 미세하게 움직이고, 넓히면 그만큼 목표에서
      # 벗어난 자리에 선다. 시뮬레이션(K=800 N/m, 100 Hz)에서 정착 오차:
      #   ±0.50 → −0.426 N   ±0.15 → −0.089 N   ±0.05 → −0.012 N
      #
      # ⚠️ 불변식은 그대로 지켜야 한다: target − deadband > teleop 이탈 문턱.
      # 0.5 − 0.05 = 0.45 > 0.2 ✅
      deadband_n: 0.05

      # admittance 감쇠 [N·s/m]. 오차 1 N 에 1 mm/s.
      # DESIGN_NOTES §7 의 B_z 와 같은 값이다.
      admittance_b_z: 1000.0

      # 하드 한계를 넘었을 때의 강제 후퇴 속도.
      retreat_speed_m_s: 0.005

      # 접촉 프로빙에서 조작자의 병진·회전을 통과시킬지.
      #
      # 거짓이 기본이다 — 로봇이 힘만 잡고 나머지 다섯 축은 정지한다. 힘을 잡는
      # 동안 옆으로 흐르면 그 힘이 무엇에 대한 힘인지 알 수 없게 된다. policy 가
      # 영상축(x, y, rz)을 맡기 전까지는 미끄러뜨릴 주체가 없다.
      allow_teleop_lateral: false

      # ---- 면내 회전 모드 ✅ 2026-08-31 ----------------------------------
      #
      # 접촉 프로빙에서 힘은 로봇이 잡되 조작자에게 **ω_y 하나만** 돌려준다.
      # 영상면은 프로브의 x–z 평면이고 +y 가 그 면의 법선(elevational)이므로,
      # y 둘레 회전은 면을 **자기 자신으로** 옮긴다 — 빔이 훑는 평면이 공간에서
      # 바뀌지 않는다. 초음파에서 rocking 이라 부르는 조작이다.
      #
      # 다른 축을 함께 열지 않는 것이 이 모드의 전부다. 각각 면을 벗어난다:
      #   ω_z  영상면을 통째로 돌린다 (§8.3 에서 영상축)
      #   ω_x  면을 기울여 빼낸다
      #   v_y  면 밖으로 미끄러진다
      #   v_x  면 안에 남지만 회전이 아니다 — 필요하면 따로 연다
      #
      # 기본은 꺼짐이고 콘솔에서 켠다 (contact.inplane → inplane_rotation_request).
      # 토픽은 창구일 뿐이며 진실은 이 파라미터다 — us_diff_ik 가 요청을 받으면
      # 자기 파라미터를 갱신하므로 `ros2 param get` 과 화면이 갈라지지 않는다.
      #
      # ⚠️ §8.2 의 rx/ry 자세 정렬이 들어오면 admittance 가 ω_y 를 쓰려 한다
      # (§8.3 의 힘축 셋 중 하나). 지금은 정렬이 미구현이라 이 축이 비어 있어서
      # 성립하는 모드이며, 그때 누가 쓰는지는 arbiter 가 정해야 한다.
      allow_teleop_inplane_rotation: false

    # ---- 워치독 (DESIGN_NOTES §12.2, 2층 구조) ----------------------------
    watchdog:
      # 하위: servo_node. 관절 지령이 끊기면 정지한다. 방향을 모르므로 후퇴하지 않는다.
      joint_cmd_timeout_s: 0.1
      # 상위: diff_ik_node. twist 가 끊기면 프로브 -z 로 후퇴한다.
      twist_timeout_s: 0.1
      # 미분 IK 는 100 Hz 인데 Touch 는 50 Hz 로 발행한다. 매 주기 최신 twist 를 다시
      # 쓰는 것(ZOH)이 기본인데, 그대로 두면 발행이 끊긴 뒤에도 워치독 만료(100 ms)까지
      # 마지막 지령이 계속 재사용된다 — 손을 멈춘 뒤에도 최대 100 ms 분의 속도가 더
      # 실리고, 그것이 서보 단의 지령 선행분으로 쌓인다.
      # 이 시간까지만 그대로 믿고, 그 뒤로는 만료까지 선형으로 0 으로 보낸다.
      # 40 ms = 발행 주기(20 ms)의 2배 — 한 번 빠뜨린 메시지는 감쇠 없이 넘어간다.
      twist_hold_s: 0.04
      joint_state_timeout_s: 0.2
      wrench_timeout_s: 0.05

      retreat_speed_m_s: 0.005
      retreat_until_force_n: 0.2

      # 후퇴 종료 조건이 힘이므로, wrench 가 함께 죽으면 무한히 물러난다.
      # 시간으로 상한을 둔다: 3 s x 5 mm/s = 15 mm.
      max_retreat_s: 3.0

    # ---- Touch 원격조작 (DESIGN_NOTES §10 TELEOP_APPROACH) -----------------
    # 프로파일이 스케일·필터·데드존을 통째로 묶는다. 값 하나만 바꾸면 안 되는 이유는
    # 복강경 자유공간 조작과 초음파 접근 조작의 요구 분해능이 자릿수로 다르기 때문이다.
    # teleop.profile 은 매 주기 읽으므로 조작 중에도 바꿀 수 있다:
    #   ros2 param set /touch_teleop_node teleop.profile us_approach
    teleop:
      profile: us_approach

      # 축별 부호 뒤집개. 아래 매핑에 곱해지기만 하며 매 주기 읽힌다.
      #   ros2 param set /touch_teleop_node teleop.angular_sign "[1.0, -1.0, 1.0]"
      #
      # 축 매핑은 이제 실측이 아니라 **규칙**으로 정해진다 (touch_twist_node.cpp).
      #   스타일러스 촉 방향(-Z) ≡ 프로브 침투 방향(+z),  스타일러스 +X ≡ 프로브 +x
      #   → A0 = diag(+1, -1, -1),  병진·회전 공통
      #   → A  = Rz(tip_roll_deg) · A0        (아래 tip_roll_deg 참조)
      # 아래 부호는 그 위에 곱해지는 예외 처리용이며 기본은 손대지 않는다.
      linear_sign: [1.0, 1.0, 1.0]
      angular_sign: [1.0, 1.0, 1.0]

      # ---- 축별 병진 이득 ✅ 2026-08-31 ----
      #
      # [x, y, z] = [좌우, 상하, 앞뒤]. **장치 world 프레임** 기준이다
      # (OpenHaptics 규약: +X 오른쪽, +Y 위, +Z 조작자 쪽). 아래 linear_scale 위에
      # 축별로 곱해진다:
      #     v = A · Rᵀ · diag(gain) · R · v_body · linear_scale
      #
      # 위 linear_sign 과 걸리는 자리가 다르다 — 부호는 **프로브 축**에, 이득은
      # **손 축**에 걸린다. body 프레임에 곱하면 이득 축이 손목을 따라 돌아, 같은
      # "앞으로 밀기" 가 파지 각도마다 다르게 증폭된다.
      #
      # 조작 피드백 (2026-08-31): 앞뒤·상하 병진이 손 움직임 대비 답답하다. 좌우는
      # 그대로 두고 두 축만 2 배로 한다. 방향이 아니라 축에 걸리므로 앞으로 밀 때와
      # 뒤로 뺄 때의 배율이 같다 — 다르면 왔던 경로를 되짚을 수 없다.
      #
      # ⚠️ 상한과 함께 본다 (§12.3). freespace 클램프 150 mm/s 에서
      # 손 100 mm/s × 1.2 × 2 = 240 mm/s 라 빠른 손동작은 클램프에 걸린다
      # (벡터 전체가 같은 비로 줄어드니 방향은 유지되고 크기만 잘린다).
      # 접촉 상한 10 mm/s 에서는 이 이득이 사실상 체감되지 않는다 — 클램프가 지배한다.
      #
      # 프로파일과 무관하게 셋 모두에 적용된다. 매 주기 읽으므로 조작 중에도 바꾼다:
      #   ros2 param set /touch_teleop_node teleop.linear_axis_gain "[1.0, 1.0, 1.0]"
      linear_axis_gain: [1.0, 2.0, 2.0]

      # 침투축(프로브 +z) 둘레 회전 [도]. 축 매핑에 남은 마지막 자유도다.
      #   A = Rz(tip_roll_deg) · diag(+1, -1, -1)      병진·회전 공통
      # 촉 ≡ 침투축 을 고정해도 그 축 둘레 회전은 남는다 — 영상면이 플랜지에 대해
      # 어떻게 놓이는지는 프로브가 실제로 장착되어야 정해지기 때문이다.
      #
      # 90 의 배수면 축 정렬이 유지되고, 90° 는 pitch 와 roll 이 맞바뀐 것으로 느껴진다.
      # 단순 축 교환이 아니라 Rz 회전으로 구현하는 이유는 행렬식 +1 을 구조적으로
      # 보장하기 위해서다 (교환은 det=-1 이라 회전이 아니라 거울상이 된다).
      #
      # ✅ 2026-08-27: **90.0 → 0.0.** 값이 바뀐 것이지 매핑이 바뀐 것이 아니다.
      #
      # 2026-08-19 에 실기로 찾은 90° 는 사실 '플랜지 → 프로브' 회전이었다. 그때
      # IK 의 툴 프레임은 플랜지였고(allow_missing_tool: true), 프로브 프레임이
      # 기구학 사슬에 없었으므로 그 회전이 갈 곳이 여기밖에 없었다.
      #
      # 이제 tool.j6_to_probe_rpy 의 yaw 가 +90° 를 들고 있다. 여기 90 을 그대로
      # 두면 Rz(90°) 가 두 번 곱해져 **지령 방향이 90° 틀어진다** — 손을 오른쪽으로
      # 밀면 프로브가 영상면 안쪽이 아니라 elevational 로 간다. 둘은 같은 회전의
      # 두 자리이므로 반드시 함께 움직인다.
      #
      # 0 이면 A = A0 = diag(+1, -1, -1) 이고, 이것이 §10.4 의 규칙 그 자체다 —
      # 스타일러스 +X ≡ 프로브 +x (영상면 내 lateral). 조작자가 느끼는 축은
      # 2026-08-19 이후 그대로다.
      #
      # ⏳ 실기에서 한 번 확인할 것: 손을 오른쪽으로 밀 때 프로브가 영상면 안쪽
      # 방향으로 가는가. 90° 어긋남은 한 번만 밀어 보면 안다.
      #
      # 매 주기 읽으므로 조작 중에 바꿔가며 확정할 수 있다:
      #   ros2 param set /touch_teleop_node teleop.tip_roll_deg 90.0
      tip_roll_deg: 0.0

      # ---- 병진 기준 프레임 (DESIGN_NOTES §10.5) ✅ 2026-08-21 ----
      #
      # teleop 경로는 원래 body → body 였다:
      #     v_base = R_base_probe(t) · A · R_stylus(t)ᵀ · v_world
      # "오른쪽으로 밀면 어디로 가는가" 를 두 자세의 **상대 관계**가 정한다는 뜻인데,
      # rate control 에서 그 관계는 유지되지 않는다. 프로브 자세는 지령 각속도의
      # 적분이고, 그 각속도는 angular_scale(1.2배) · angular_deadzone · 클램프 ·
      # 필터 · DLS 감쇠를 통과한다. 특히 데드존이 정류기로 동작한다 — 빠르게 비트는
      # 동작은 통과하고 천천히 되돌리는 동작은 문턱 아래라 버려져, 한 방향으로만 쌓인다.
      #
      # 2026-08-21 실측 (touch_teleop/tools/teleop_frame_audit.py):
      #   "스타일러스 +X 밀기" 방향이 한 세션에 10° → 104° 단조 증가 (최대 135°).
      #   데드맨 재파지로 전혀 복구되지 않음 (76.7→76.7, 86.3→87.3, 96.7→96.4).
      #   한 파지 37초 안에서만 10° → 76.7°.  놓는 것이 원인을 만드는 게 아니라,
      #   놓아도 리셋되지 않는 것이 문제였다.
      #
      #   latched: 첫 파지 순간의 축을 고정 행렬로 잡아 세션 내내 유지한다.
      #            시간 의존 항이 사라지므로 표류가 **원리적으로 불가능**하다.
      #            잡는 그 순간에는 아래 probe 와 정확히 같은 매핑이라, 파지를 시작할 때
      #            느끼는 축은 안 바뀌고 그 뒤로 어긋나지만 않는다.
      #   probe:   예전 거동. 비교·회귀 확인용으로만 남긴다.
      #
      linear_frame: latched

      # ---- 접촉 프로빙 전환 ✅ 2026-08-25 · 🔁 2026-08-31 개정 ----
      #
      # 접촉력이 이 값을 넘으면 us_diff_ik 가 접근 상한(freespace 150 mm/s)에서
      # 접촉 상한(10 mm/s)으로 갈아 끼우고, **그때부터 힘을 스스로 잡는다**
      # (아래 contact_control). 조작자가 손으로 바꾸는 것이 아니다 — 접촉은 예고 없이
      # 시작되고, 그 순간 손이 파라미터를 만지고 있을 리 없다.
      #
      # 🔁 2026-08-31: 8.0 → 1.0, 그리고 기준이 **법선력 F_n 에서 접촉력 크기 ‖F‖ 로**
      # 바뀌었다 (ft_sensor.contact_force_mode). 둘은 함께 움직여야 한다:
      # 8 N 은 프로브가 어느 방향으로 닿든 F_z 에 충분히 실리는 크기였지만 몇 N 은
      # 아니다. 조금만 기울어 닿으면 접촉력의 상당 부분이 횡력으로 가고, F_z 하나로는
      # 문턱을 못 넘는다 — 즉 **닿았는데 접근 속도를 유지한다.**
      #
      # 🔁 2026-08-31 (2차): 1.0 → 2.0. 잡음과 보상 잔차 위의 여유를 더 잡는다.
      # 1.0 은 PX6D 축당 ±0.05 N 위로는 넉넉했지만 **보상 잔차 위로는 아니었다** —
      # 무접촉 잔차가 프로브가 위·옆을 볼 때 −0.32 N (SD 0.10) 이고 최대 |e| 가
      # 0.47 N 이라, 자세에 따라 문턱의 절반이 잔차로 차 있었다.
      #
      # ⚠️ 올린 대가는 **늦게 잡는 것**이다. 그 사이 자유공간 상한(150 mm/s)으로
      # 조직을 미는 시간이 길어진다 — probe.yaml 이 아래 confirm_s 주석에서
      # "늦게 조이는 것이 일찍 조이는 것보다 위험하다" 고 적어 둔 바로 그 위험이다.
      # 팬텀에서 접촉을 늦게 잡는 느낌이면 되돌릴 것.
      #
      # 저울 보정을 뺐으므로 이 2.0 은 **파이프라인이 내는 값 그대로 2.0** 이다.
      # 보정이 있던 동안에는 참 접촉력 1.71 N 에서 걸렸다.
      contact_probing_force_n: 2.0

      # 연속으로 문턱을 넘어야 하는 시간. 100 Hz 에서 두 표본이다.
      # 짧게 두는 이유: 늦게 조이는 것이 일찍 조이는 것보다 위험하다. 접촉을 놓치면
      # 자유공간 속도로 조직을 미는 시간이 길어진다.
      contact_probing_confirm_s: 0.02

      # 접근으로 되돌아가는 문턱 [N]. 0 이하 = 되돌아가지 않는다(2026-08-31 이전 거동).
      #
      # 🔁 2026-08-31 신설. 그전까지 전환은 단방향이었고, 문턱이 8 N 이던 동안에는
      # 맞는 선택이었다 — 그 힘에 닿았다면 이미 작업 중이고, 프로브를 살짝 떼는 것은
      # 작업의 일부이지 끝이 아니다.
      #
      # 1 N 에서는 그 논리가 뒤집힌다. **스치기만 해도 넘는다.** 단방향이면 세션 초반의
      # 우연한 접촉 한 번으로 남은 세션 전체가 10 mm/s 에 묶이고, 150 mm 를 옮기는 데
      # 15 초가 걸린다. 게다가 접촉 프로빙에서는 조작자의 여섯 축이 전부 0 이라
      # (contact_control.allow_teleop_lateral: false) **스스로 빠져나올 수단이 없다** —
      # 데드맨을 놓아 워치독 후퇴를 부르는 것이 유일한 길이고, 그 후퇴의 종료 조건
      # (watchdog.retreat_until_force_n = 0.2)과 같은 자리에 이 값을 둔다.
      #
      # 진입(1.0)보다 낮아야 하고, 유지 밴드의 아래끝(2.0 - 0.3 = 1.7)보다도 낮아야
      # 한다 — 힘을 정상적으로 잡고 있는 동안 이탈 조건이 성립하면 모드가 오간다.
      # us_diff_ik 가 기동할 때 이 관계를 확인하고 어긋나면 경고한다.
      contact_probing_release_n: 0.3

      # 이탈 확인 창 [s]. 진입(20 ms)보다 25 배 길다.
      # 누르는 중의 순간적인 힘 감소로 접근 속도(150 mm/s)가 되살아나는 것이 이
      # 판정에서 가장 위험한 오작동이다. contact_state.py 의 규약과 같다.
      contact_probing_release_confirm_s: 0.5

      # ---- 회전 기준 프레임 ✅ 2026-08-25 ----
      #
      #   latched: 병진과 **같은** R_latch 를 쓴다. 기본.
      #   body:    예전 거동 (w_base = R_base_probe(t) · w_cmd). 비교용.
      #
      # 2026-08-21 에는 회전을 손대지 않았다. 근거는 "손목을 비틀면 프로브가
      # 비틀린다" 는 대응을 조작자가 프로브를 보며 직접 보정하니 병진처럼 화면 밖으로
      # 어긋나지 않는다는 것이었다. **실기 조작에서 그 전제가 틀렸다** (2026-08-25).
      #
      # 회전 경로를 펼치면 병진과 같은 형태다:
      #     w_base = R_base_probe(t) · A · R_stylus(t)ᵀ · w_world
      # 시간 의존 회전 두 개가 그대로 있고, 사이에 놓인 것도 같다 — angular_scale ·
      # angular_deadzone · 클램프 · 필터 · DLS 감쇠. 데드존이 정류기로 동작하는 것까지
      # 같으므로 표류 메커니즘이 다르지 않다.
      #
      # 병진과 기준을 공유하는 것이 중요하다. 따로 잡으면 손을 대각선으로 움직일 때
      # 병진의 '오른쪽' 과 회전의 '오른쪽' 이 서로 다른 방향을 가리킨다.
      #
      # 2026-08-25: latched 로 넣었다가 **body 로 되돌렸다** (조작자 판단). 기능은
      # 남겨 두므로 파라미터 하나로 다시 켤 수 있다. 회전 이상의 원인이 표류인지
      # 축 배정(tip_roll_deg 의 yaw 미확인, §10.4)인지 아직 갈리지 않았고, 두 값을
      # 오가며 비교하는 것이 그것을 가르는 방법이다.
      #
      # 조작 중 ros2 param set 으로 바꿀 수 있으나 **다음 파지에서** 반영된다 —
      # 조작 중에 프레임이 바뀌면 지령 방향이 한 주기에 튀기 때문이다:
      #     ros2 param set /us_diff_ik_node teleop.angular_frame latched
      angular_frame: body

      # 파지마다 기준을 다시 잡을 것인가.
      #
      # false 를 기본으로 둔다. 파지마다 다시 잡으면 표류는 안 쌓이지만 **파지마다
      # 축이 달라진다** — 조작자에게는 "가끔 축이 바뀐다" 로 느껴지고, 천천히
      # 어긋나는 것보다 오히려 헷갈린다. 조작자가 자리를 옮겨 기준을 새로 잡고 싶을
      # 때만 켠다 (조작 중 ros2 param set 으로는 안 되고 재기동이 필요하다).
      relatch_on_engage: false

      # ---- 조작자가 선 자리 ✅ 2026-08-27 ----
      #
      # 지금까지의 매핑은 조작자와 로봇이 **같은 방향을 본다**고 가정했다. 마주보고
      # 서면 그 가정이 깨진다 — 조작자의 앞은 로봇의 뒤이고, 조작자의 오른쪽은
      # 로봇의 왼쪽이다. 조작자에게는 "밀면 반대로 온다" 로 느껴진다.
      #
      # 고치는 것은 base 수직축 둘레 회전 하나다:
      #     v_base = Rz_base(operator_yaw) · (지금까지의 v_base)      병진·회전 공통
      #
      #     0    나란히 — 조작자와 로봇이 같은 방향 (기본, 지금까지의 거동)
      #   180    마주보기 — 흔히 말하는 "미러 모드"
      #   ±90    로봇 옆에 선 경우
      #
      # **거울(반사)이 아니라 회전이다.** 진짜 거울상은 좌우만 뒤집고 앞뒤는 두는데,
      # 로봇 반대편으로 걸어가면 앞뒤도 같이 뒤집힌다 — 그것이 회전이다. 게다가
      # 반사는 det=-1 이라 twist 가 강체 운동이 아니게 되고, 각속도가 유사벡터라
      # 회전 지령이 거울상으로 망가진다 (§10.4 가 축 교환을 버린 것과 같은 이유).
      #
      # 침투축(프로브 z)은 어느 값에서도 바뀌지 않는다. 뒤집히는 것은 수평 두 축뿐이다.
      #
      # **다음 파지부터** 적용된다. 조작 중에 뒤집히면 같은 손동작에 로봇이 반대로
      # 가고, 그 순간 조작자의 반사적인 교정은 상황을 악화시키는 방향이다.
      #
      # 콘솔(Teleoperation 화면)에서 고르거나, 직접:
      #   ros2 param set /us_diff_ik_node teleop.operator_yaw_deg 180.0
      operator_yaw_deg: 0.0

      # stylus_pose 발행이 이 시간보다 길게 끊겼다 다시 오면 "데드맨을 새로 잡았다"
      # 로 본다. touch_twist_node 는 데드맨을 잡고 있는 동안에만 발행하므로,
      # 재파지 감지에 별도 토픽이 필요 없다. 발행 주기 20 ms 의 15배로 잡았다.
      engage_gap_s: 0.3

      # 기존 복강경 값. 참조용으로 남긴다.
      laparoscopic:
        linear_scale: 0.6
        angular_scale: 0.6
        filter_alpha: 0.4
        linear_deadzone: 0.001
        angular_deadzone: 0.1

      # 초음파 접근용. 회전 데드존이 핵심이다.
      #   이전(0.1 rad/s x 0.6): 최소 지령 0.060 rad/s / 상한 0.2  →  사용구간  3:1
      #   현재(0.02      x 0.15): 최소 지령 0.003 rad/s / 상한 0.2  →  사용구간 67:1
      # angular_deadzone 은 Touch 장치의 회전 잡음 바닥 위에 있어야 한다. 실측 전이라
      # 추정값이며, 너무 낮으면 손을 멈춰도 프로브가 천천히 흐른다.
      us_approach:
        linear_scale: 0.08          # 손 100 mm/s → EE 8 mm/s
        angular_scale: 0.15         # 손 1 rad/s  → EE 0.15 rad/s

        # filter_alpha: 2026-08-18 실측에서 회전 잡음 분포의 꼬리가 두꺼웠다
        # (p99 가 p95 의 5 배). 꼬리는 데드존으로 못 막는다 — 막으려면 분해능을
        # 버려야 한다. 필터를 무겁게 해서 스파이크 진폭을 줄인다.
        #   alpha 0.25 → 시정수 약 60 ms
        #   alpha 0.12 → 시정수 약 150 ms
        # 접근 단계는 느려도 되므로 (§10.4) 지연을 지불할 여유가 있다.
        filter_alpha: 0.12

        # 데드존: 2026-08-18 실측으로 확정 (30 s × 2 조건, n=1601)
        #
        #                     손 올리고 정지(A)   손 뗌(B)
        #   병진 p95            0.00238           0.00038
        #   회전 p95            0.0495            0.0164
        #
        # 두 가지를 알 수 있다.
        #  1) 주된 잡음원은 장치가 아니라 손이다 (병진 6 배, 회전 3 배)
        #  2) 기존 angular_deadzone 0.02 는 장치 잡음 바닥(B p95=0.0164)에
        #     맞춰져 있었다. 손떨림은 애초에 대상이 아니었다.
        #
        # p99 가 아니라 p95 를 기준으로 삼는다. p99(회전 0.265)로 잡으면
        # 사용 구간이 5:1 로 떨어져, §10.4 가 복강경 값(3.3:1)을 버린 이유를
        # 그대로 반복하게 된다.
        linear_deadzone: 0.002      # A p95 0.00238 과 사실상 동일 — 유지
        angular_deadzone: 0.05      # A p95. 최소 지령 0.0075 rad/s (0.43°/s),
                                    # 사용 구간 26.7 : 1

      # 자유공간 검증용. 프로브도 조직도 없는 단계에서 접촉용 스케일을 쓸 이유가 없다.
      # us_phase0.launch.py 의 freespace:=true 로 함께 켜진다 — 프로파일만 바꾸면
      # safety.max_linear_vel_m_s(0.010) 클램프에 걸려 체감이 달라지지 않는다.
      #
      # 데드존은 손 잡음 특성이므로 us_approach 와 같은 값을 쓴다 (2026-08-18 실측).
      freespace:
        # 2026-08-18 조작 피드백으로 3배 상향 (0.4 → 1.2). 거의 1:1 이다.
        #
        # 2026-08-19 이력 — 값을 되돌린 경위를 남긴다:
        #   1.2 → 6.0 (5배 상향).  단, 이때 us_diff_ik 가 패키지 메타데이터 문제로
        #        죽어 있어 로봇이 아예 안 움직였다. "스케일이 작다" 는 피드백은
        #        실은 IK 부재였고, 스케일과 무관했다.
        #   6.0 → 1.2 (원복).  IK 를 고친 뒤 6.0 으로 실제 조작해 보니 너무 빨랐다.
        #        즉 최초의 1.2 가 과소평가된 값이 아니었다.
        linear_scale: 1.2           # 손 100 mm/s → EE 120 mm/s
        angular_scale: 1.2
        filter_alpha: 0.3           # 자유공간은 지연이 적은 쪽이 낫다
        linear_deadzone: 0.002
        angular_deadzone: 0.05

    # ---- US 프레임그래버 (DESIGN_NOTES §3) ---------------------------------
    # 장비는 자기 AP 에서만 영상을 낸다. host 는 그 AP 안의 주소이며
    # robot.ip(192.168.58.3, 유선 robot-net)와는 완전히 다른 망이다.
    #
    # 실측 8 fps 다 (2026-08-06 PCAP: 128블록 런이 초당 약 7.97회).
    # 아키텍처 그림의 30 Hz 는 이 장비에는 해당하지 않는다.
    us:
      host: "192.168.1.1"
      video_port: 5002
      control_port: 5003
      topic: "/us/image"
      frame_id: "us_image"

      # 방향 보정: none | rot90_ccw | rot90_cw | rot180
      #
      # FrameBridge 출력과 대조 검증되기 전까지 "none" 을 유지한다. 검증 안 된
      # 변환을 데이터 경로에 넣으면 하류 세그멘테이션과 기하가 조용히 틀어진다.
      # 확인은 뷰어 쪽 슬라이더로 먼저 하고, 확정된 뒤에 여기에 적는다.
      orientation: "none"

      reconnect_period_s: 2.0
      # 이 시간 동안 프레임이 없으면 경고한다. 장비가 스캔 상태가 아니거나
      # Windows 앱이 AP 를 점유하고 있는 경우가 대부분이다.
      stale_timeout_s: 2.0
      report_period_s: 5.0

    # ---- 루프 주기 (DESIGN_NOTES §11) -------------------------------------
    rates:
      servo_hz: 125.0
      cartesian_hz: 100.0
      wrench_publish_hz: 100.0
      status_publish_hz: 200.0

    # ---- 역기구학 -------------------------------------------------------
    ik:
      # DLS 로 상위 아키텍처를 먼저 검증한다. QP 는 보류 (DESIGN_NOTES §9).
      solver: dls
      dls_damping: 0.02
      # 축별 추종오차 임계. 힘축이 조용히 뭉개지는 것을 잡는다.
      tracking_error_linear_m_s: 0.002
      tracking_error_angular_rad_s: 0.05

    # ---- mock 백엔드 전용 -------------------------------------------------
    # 실패 경로는 실로봇에서 일부러 일으키기 곤란하므로 여기서 주입한다.
    mock:
      # 프로브가 이 깊이(base +z 기준, 미터)보다 아래로 내려가면 접촉으로 친다.
      contact_plane_z: 0.30
      # 합성 접촉 강성 [N/m]. 침투 깊이에 비례한 F_z 를 낸다.
      contact_stiffness_n_m: 2000.0
      ft_noise_std_n: 0.02
      # 주입 실패 (0 = 비활성)
      drop_wrench_after_s: 0.0
      freeze_state_after_s: 0.0
